name: Apply atomic Home to Map handoff fix

on:
  push:
    branches: [b225-ui-home]
    paths:
      - .github/workflows/apply-map-handoff-race-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply atomic handoff source fix
        run: |
          python - <<'PY'
          from pathlib import Path

          host = Path('src/features/search/SearchTransitionHost.jsx')
          s = host.read_text()

          s = s.replace(
              "import { useEffect, useMemo, useRef, useState } from 'react'",
              "import { useCallback, useEffect, useMemo, useRef, useState } from 'react'",
              1,
          )
          anchor = "import { MapContainer } from '../map-engine/MapContainer.jsx'\n"
          handoff_import = "import { beginMapHandoff, endMapHandoff, MAP_READY_EVENT } from './mapHandoff.js'\n"
          if handoff_import not in s:
              if anchor not in s: raise SystemExit('MapContainer import anchor missing')
              s = s.replace(anchor, anchor + handoff_import, 1)

          refs_anchor = "  const readyTimerRef = useRef(0)\n  const lockedScrollYRef = useRef(0)"
          refs_replacement = "  const readyTimerRef = useRef(0)\n  const handoffFallbackTimerRef = useRef(0)\n  const mapHandoffRef = useRef(false)\n  const skipScrollRestoreRef = useRef(false)\n  const lockedScrollYRef = useRef(0)"
          if refs_anchor not in s: raise SystemExit('refs anchor missing')
          s = s.replace(refs_anchor, refs_replacement, 1)

          clear_old = """  const clearTimers = () => {\n    window.clearTimeout(closeTimerRef.current)\n    window.clearTimeout(completeTimerRef.current)\n    window.clearTimeout(stepTimerRef.current)\n    window.clearTimeout(readyTimerRef.current)\n  }\n"""
          clear_new = """  const clearTimers = () => {\n    window.clearTimeout(closeTimerRef.current)\n    window.clearTimeout(completeTimerRef.current)\n    window.clearTimeout(stepTimerRef.current)\n    window.clearTimeout(readyTimerRef.current)\n    window.clearTimeout(handoffFallbackTimerRef.current)\n  }\n\n  const finalizeMapHandoff = useCallback(() => {\n    if (!mapHandoffRef.current) return\n    window.clearTimeout(handoffFallbackTimerRef.current)\n    mapHandoffRef.current = false\n    endMapHandoff()\n    window.requestAnimationFrame(() => {\n      setActive(false)\n      setComplete(false)\n      setDestinationQuery('')\n      setAddressMode(false)\n    })\n  }, [])\n"""
          if clear_old not in s: raise SystemExit('clearTimers block missing')
          s = s.replace(clear_old, clear_new, 1)

          click_anchor = "      clearTimers()\n      const rect = trigger.getBoundingClientRect()"
          click_replacement = "      clearTimers()\n      endMapHandoff()\n      mapHandoffRef.current = false\n      skipScrollRestoreRef.current = false\n      const rect = trigger.getBoundingClientRect()"
          if click_anchor not in s: raise SystemExit('search click anchor missing')
          s = s.replace(click_anchor, click_replacement, 1)

          scroll_old = "      window.scrollTo(0, lockedScrollYRef.current)"
          scroll_new = "      if (!skipScrollRestoreRef.current) window.scrollTo(0, lockedScrollYRef.current)\n      skipScrollRestoreRef.current = false"
          if scroll_old not in s: raise SystemExit('scroll restore anchor missing')
          s = s.replace(scroll_old, scroll_new, 1)

          cleanup_old = "  useEffect(() => () => clearTimers(), [])"
          cleanup_new = """  useEffect(() => {\n    const onMapReady = () => {\n      if (!mapHandoffRef.current) return\n      window.requestAnimationFrame(finalizeMapHandoff)\n    }\n    window.addEventListener(MAP_READY_EVENT, onMapReady)\n    return () => window.removeEventListener(MAP_READY_EVENT, onMapReady)\n  }, [finalizeMapHandoff])\n\n  useEffect(() => () => {\n    clearTimers()\n    if (mapHandoffRef.current) {\n      mapHandoffRef.current = false\n      endMapHandoff()\n    }\n  }, [])"""
          if cleanup_old not in s: raise SystemExit('cleanup effect missing')
          s = s.replace(cleanup_old, cleanup_new, 1)

          submit_old = """  const submitSearch = () => {\n    if (!state.destination || !datesValid || state.adults < 1) return\n    clearTimers()\n    saveRecent()\n    setReady(false)\n    setComplete(true)\n    setOpen(false)\n    const path = buildMapSearchPath(state)\n    completeTimerRef.current = window.setTimeout(() => {\n      onNavigate(path)\n      setActive(false)\n      setComplete(false)\n      setDestinationQuery('')\n      setAddressMode(false)\n    }, COMPLETE_MS)\n  }\n"""
          submit_new = """  const submitSearch = () => {\n    if (!state.destination || !datesValid || state.adults < 1) return\n    clearTimers()\n    saveRecent()\n    beginMapHandoff()\n    mapHandoffRef.current = true\n    skipScrollRestoreRef.current = true\n    setReady(false)\n    setComplete(true)\n    setOpen(false)\n    const path = buildMapSearchPath(state)\n    completeTimerRef.current = window.setTimeout(() => {\n      onNavigate(path)\n      handoffFallbackTimerRef.current = window.setTimeout(finalizeMapHandoff, 2500)\n    }, COMPLETE_MS)\n  }\n"""
          if submit_old not in s: raise SystemExit('submitSearch block missing')
          s = s.replace(submit_old, submit_new, 1)
          host.write_text(s)

          css = Path('src/features/search/searchExactFit.css')
          c = css.read_text()
          c = c.replace(
              'body:has(> .movera-st--complete) [data-testid="page-home"] .b225-search',
              'body[data-movera-map-handoff="true"] [data-testid="page-home"] .b225-search',
              1,
          )
          persistent_rule = """\n/* During the final handoff, the popup's persistent Home-style bar must not be\n   mistaken for the real Home search bar while MapPage is loading. */\n.movera-st--complete .movera-st__persistent-search{\n  opacity:0!important;\n  visibility:hidden!important;\n  pointer-events:none!important;\n  transition:none!important;\n}\n"""
          if '.movera-st--complete .movera-st__persistent-search' not in c:
              c += persistent_rule
          css.write_text(c)
          PY

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/handoff.log 2>&1 &
          echo $! > /tmp/handoff.pid
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4173/Movera-host1/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/handoff.log; exit 1

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Verify atomic handoff desktop and iPhone
        run: |
          cat > /tmp/handoff.mjs <<'EOF'
          import { chromium } from 'playwright'
          const base='http://127.0.0.1:4173/Movera-host1/'

          async function run(label, contextOptions) {
            const browser=await chromium.launch({headless:true})
            const context=await browser.newContext(contextOptions)
            const page=await context.newPage()
            const runtime=[]
            page.on('pageerror',e=>runtime.push(e.message))
            await page.goto(base,{waitUntil:'networkidle'})
            await page.getByTestId('page-home').waitFor({state:'visible'})
            await page.locator('.b225-search').first().click({position:{x:80,y:25}})
            const popup=page.getByTestId('search-transition')
            const input=page.locator('.movera-st__persistent-search input')
            await popup.waitFor({state:'visible'})
            await page.waitForTimeout(1350)
            await input.click()
            await input.fill('Marsa')
            const suggestion=page.locator('.movera-st__address-suggestion').first()
            await suggestion.waitFor({state:'visible',timeout:2500})
            await suggestion.click()
            await page.waitForTimeout(700)
            const days=page.locator('.movera-st__day:not([disabled]):not(.movera-st__day--empty)')
            await days.nth(0).click(); await days.nth(2).click(); await page.waitForTimeout(550)
            const next=page.getByRole('button',{name:/Continuer vers les voyageurs/})
            await next.click(); await page.waitForTimeout(650)
            const finalButton=page.getByRole('button',{name:/Rechercher sur la carte/})
            const homeSearch=page.getByTestId('page-home').locator('.b225-search').first()
            await finalButton.click()
            await page.waitForTimeout(60)
            const handoffAtStart=await page.locator('body').getAttribute('data-movera-map-handoff')
            if(handoffAtStart!=='true') throw new Error(`${label}: explicit map handoff did not start`)
            if(await homeSearch.isVisible()) throw new Error(`${label}: Home search visible during handoff start`)
            const persistent=page.locator('.movera-st__persistent-search')
            if(await persistent.isVisible()) throw new Error(`${label}: persistent popup search visible during complete handoff`)

            await page.waitForURL(/\/map(?:\?|$)/,{timeout:1800})
            const mapPage=page.getByTestId('page-map')
            await mapPage.waitFor({state:'visible',timeout:2200})
            if(await popup.count()!==1) throw new Error(`${label}: popup removed before MapPage first visible frame`)
            if(await page.locator('body').getAttribute('data-movera-map-handoff')!=='true') throw new Error(`${label}: handoff guard ended before MapPage ready signal`)

            await popup.waitFor({state:'detached',timeout:1800})
            await page.waitForTimeout(60)
            if(await page.locator('body').getAttribute('data-movera-map-handoff')) throw new Error(`${label}: handoff guard not cleared after MapPage ready`)
            if(!await mapPage.isVisible()) throw new Error(`${label}: MapPage not visible after handoff`)
            if(!await page.locator('.b225-map-search').isVisible()) throw new Error(`${label}: Map search missing after handoff`)
            if(await homeSearch.isVisible()) throw new Error(`${label}: Home search visible after MapPage handoff`)
            if(runtime.length) throw new Error(`${label}: runtime errors ${runtime.join('; ')}`)
            await browser.close()
          }

          await run('Desktop',{viewport:{width:390,height:844}})
          await run('iPhone',{viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:3,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'})
          console.log('PASS atomic Home -> Map handoff')
          EOF
          node /tmp/handoff.mjs

      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/handoff.pid) || true

      - name: Persist validated fix
        run: |
          rm -f .github/workflows/apply-map-handoff-race-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/search/SearchTransitionHost.jsx src/features/search/searchExactFit.css src/features/map/MapPage.jsx src/features/search/mapHandoff.js .github/workflows/apply-map-handoff-race-fix.yml
          git commit -m "fix(search): atomic map handoff validated [skip ci]"
          git pull --rebase origin b225-ui-home
          git push
