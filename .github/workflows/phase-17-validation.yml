name: Phase 17 Validation
on:
  push:
    branches: [phase17-performance-engineering]
  pull_request:
    branches: [phase16-responsive-accessibility]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Bundle budget gate
        run: |
          node <<'EOF'
          import fs from 'node:fs'
          import path from 'node:path'
          const dir='dist/assets'
          const files=fs.readdirSync(dir)
          const js=files.filter(f=>f.endsWith('.js')).map(f=>({f,size:fs.statSync(path.join(dir,f)).size}))
          const css=files.filter(f=>f.endsWith('.css')).map(f=>({f,size:fs.statSync(path.join(dir,f)).size}))
          const entry=js.filter(x=>x.f.startsWith('index-')).sort((a,b)=>b.size-a.size)[0]
          const totalJs=js.reduce((n,x)=>n+x.size,0)
          const totalCss=css.reduce((n,x)=>n+x.size,0)
          console.log({entry, totalJs, totalCss, jsChunks:js.length})
          if(!entry||entry.size>210*1024) throw new Error(`entry bundle over budget: ${entry?.size}`)
          if(totalJs>340*1024) throw new Error(`total JS over budget: ${totalJs}`)
          if(totalCss>90*1024) throw new Error(`CSS over budget: ${totalCss}`)
          if(js.length<5) throw new Error(`route splitting not proven: only ${js.length} JS chunks`)
          EOF
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/movera-preview.log 2>&1 &
          echo $! > /tmp/movera-preview.pid
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/movera-preview.log; exit 1
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Phase 17 runtime performance gate
        run: |
          cat > phase17-smoke.mjs <<'EOF'
          import { chromium } from 'playwright'
          const browser=await chromium.launch({headless:true})
          const page=await browser.newPage({viewport:{width:390,height:844}})
          const errors=[]
          page.on('pageerror',e=>errors.push(e.message))
          await page.addInitScript(() => {
            const watched=new Set(['orientationchange','pagehide','pageshow','visibilitychange'])
            const counts={}
            const add=EventTarget.prototype.addEventListener
            const remove=EventTarget.prototype.removeEventListener
            EventTarget.prototype.addEventListener=function(type,...rest){if(watched.has(type)){counts[type]=(counts[type]||0)+1}return add.call(this,type,...rest)}
            EventTarget.prototype.removeEventListener=function(type,...rest){if(watched.has(type)){counts[type]=(counts[type]||0)-1}return remove.call(this,type,...rest)}
            window.__listenerCounts=counts
          })
          const watched=['orientationchange','pagehide','pageshow','visibilitychange']
          const normalizedCounts=async()=>page.evaluate((types)=>Object.fromEntries(types.map(type=>[type,window.__listenerCounts[type]||0])),watched)
          const go=async(path)=>{await page.evaluate((p)=>{history.pushState({},'',p);window.dispatchEvent(new PopStateEvent('popstate'))},path);await page.waitForTimeout(40)}
          await page.goto('http://127.0.0.1:4173/')
          const baseline=await normalizedCounts()
          for(let i=0;i<12;i++){
            await go('/map')
            await page.getByTestId('map-engine').waitFor()
            if(await page.getByTestId('map-engine').count()!==1) throw new Error('duplicate map instance')
            await go('/')
            await page.getByTestId('page-home').waitFor()
            if(await page.getByTestId('map-engine').count()!==0) throw new Error('map did not unmount')
          }
          const after=await normalizedCounts()
          if(JSON.stringify(after)!==JSON.stringify(baseline)) throw new Error(`obvious listener leak: baseline=${JSON.stringify(baseline)} after=${JSON.stringify(after)}`)

          await go('/map')
          const surface=page.getByTestId('map-surface')
          await surface.waitFor()
          const before=Number(await surface.getAttribute('data-update-count'))
          await surface.evaluate((el)=>{for(let i=0;i<120;i++)el.dispatchEvent(new WheelEvent('wheel',{deltaY:i%2?-80:80,bubbles:true,cancelable:true}))})
          await page.waitForTimeout(120)
          const afterBurst=Number(await surface.getAttribute('data-update-count'))
          const committed=afterBurst-before
          if(committed>30) throw new Error(`map update burst not coalesced: ${committed}`)
          await page.getByRole('button',{name:'Recentrer la carte'}).click()
          await page.waitForTimeout(80)
          const markerLayer=page.getByTestId('map-marker-layer')
          await markerLayer.waitFor()
          if(Number(await markerLayer.getAttribute('data-marker-count'))!==3) throw new Error('marker layer unstable')
          const zoomIn=page.getByRole('button',{name:'Zoom avant'})
          const zoomOut=page.getByRole('button',{name:'Zoom arrière'})
          for(let i=0;i<20;i++){
            await (i%2===0?zoomIn:zoomOut).click()
            await page.waitForTimeout(16)
          }
          await page.getByRole('button',{name:'Recentrer la carte'}).click()
          await page.waitForTimeout(80)
          if(await page.getByTestId('map-engine').count()!==1) throw new Error('map unstable after interactions')
          if(errors.length) throw new Error(`runtime errors: ${errors.join('; ')}`)
          await browser.close()
          EOF
          node phase17-smoke.mjs
      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/movera-preview.pid) || true
