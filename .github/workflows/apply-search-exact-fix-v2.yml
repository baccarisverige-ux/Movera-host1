name: Apply exact Search dynamic fit correction v2

on:
  push:
    branches: [b225-ui-home]
    paths:
      - .github/workflows/apply-search-exact-fix-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply exact source corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          host = Path('src/features/search/SearchTransitionHost.jsx')
          s = host.read_text()
          s = s.replace("import { SEARCH_ADDRESS_SUGGESTIONS, SEARCH_DESTINATIONS } from './searchData.js'", "import { SEARCH_DESTINATIONS } from './searchData.js'")

          anchor = "import { useSearchPanelFit } from './useSearchPanelFit.js'"
          imports = "import { useAddressAutocomplete } from './useAddressAutocomplete.js'\nimport { useSearchPanelFit } from './useSearchPanelFit.js'\nimport { useSearchPanelHeightMotion } from './useSearchPanelHeightMotion.js'"
          if "useAddressAutocomplete" not in s:
              if anchor not in s: raise SystemExit('fit hook import missing')
              s = s.replace(anchor, imports, 1)

          pattern = re.compile(r"  const filteredAddressSuggestions = useMemo\(\(\) => \{.*?\n  \}, \[destinationQuery\]\)\n  const \{ contentRef, panelHeight: fittedPanelHeight \} = useSearchPanelFit\(\{ active, step, addressMode, lockedViewportHeight \}\)", re.S)
          replacement = "  const { suggestions: addressSuggestions, loading: addressLoading } = useAddressAutocomplete(destinationQuery, addressMode)\n  const { contentRef, panelHeight: fittedPanelHeight } = useSearchPanelFit({ active, step, addressMode, lockedViewportHeight })\n  const fallbackPanelHeight = Math.min(570, Math.max(455, Math.round(lockedViewportHeight * 0.64)))\n  const animatedPanelHeight = useSearchPanelHeightMotion({ active, open, ready, targetHeight: fittedPanelHeight, fallbackHeight: fallbackPanelHeight })"
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1: raise SystemExit(f'fit block replacement={n}')

          old = "  if (!active) return null\n\n  const fallbackPanelHeight = Math.min(570, Math.max(455, Math.round(lockedViewportHeight * 0.64)))\n  const panelHeight = fittedPanelHeight || fallbackPanelHeight"
          if old not in s: raise SystemExit('old panel height block missing')
          s = s.replace(old, "  if (!active) return null\n\n  const panelHeight = animatedPanelHeight", 1)
          s = s.replace('filteredAddressSuggestions', 'addressSuggestions')

          marker = "              <span className=\"movera-st__address-label\">{destinationQuery.trim() ? 'Adresses suggérées' : 'Adresses populaires'}</span>"
          if 'movera-st__address-loading' not in s:
              s = s.replace(marker, marker + "\n              {addressLoading ? <div className=\"movera-st__address-loading\" role=\"status\">Recherche d’adresses…</div> : null}", 1)
          s = s.replace('id="movera-address-suggestions">', 'id="movera-address-suggestions" aria-busy={addressLoading ? \'true\' : \'false\'}>', 1)
          host.write_text(s)

          stability = Path('src/features/search/searchTransition-stability.css')
          s = stability.read_text()
          s, nf = re.subn(r'\.movera-st__panel:has\(\.movera-st__destination-search input:focus\)[^{]*\{[^}]*\}', '', s)
          s, nh = re.subn(r'\.movera-st\[data-step="(?:destination|dates|guests)"\]\{--st-panel-height:[^}]*\}', '', s)
          s = s.replace('.movera-st--open .movera-st__panel{height:var(--st-panel-height)!important}', '')
          if nf < 2 or nh < 3: raise SystemExit(f'legacy cleanup focus={nf} heights={nh}')
          stability.write_text(s)

          transition = Path('src/features/search/searchTransition.css')
          s = transition.read_text()
          s, na = re.subn(r'animation:moveraStScreen[^;}]*;?', '', s)
          if na < 1: raise SystemExit('legacy screen animation not removed')
          transition.write_text(s)

          address_css = Path('src/features/search/searchAddressMode.css')
          s = address_css.read_text()
          if '.movera-st__address-loading' not in s:
              s += "\n.movera-st__address-loading{margin:0 0 7px 3px;color:#7e8781;font-size:8.2px;font-weight:650;letter-spacing:.01em;animation:moveraAddressPulse 1s ease-in-out infinite}\n@keyframes moveraAddressPulse{0%,100%{opacity:.45}50%{opacity:1}}\n@media(prefers-reduced-motion:reduce){.movera-st__address-loading{animation:none}}\n"
          address_css.write_text(s)

          ci = Path('.github/workflows/search-motion-targeted-e2e.yml')
          s = ci.read_text()
          s = s.replace('await page.waitForTimeout(1050)', 'await page.waitForTimeout(1350)', 1)
          old = """            await input.click()\n            if(!await input.evaluate(el=>document.activeElement===el)) throw new Error(`${label}: intentional input focus failed`)\n            await input.blur()\n            await page.waitForTimeout(500)\n"""
          new = """            const fullBox=await panel.boundingBox()\n            await input.click()\n            if(!await input.evaluate(el=>document.activeElement===el)) throw new Error(`${label}: intentional input focus failed`)\n            await page.waitForTimeout(500)\n            if(await popup.getAttribute('data-address-mode')!=='true') throw new Error(`${label}: address mode did not activate`)\n            const compactBox=await panel.boundingBox()\n            if(!fullBox||!compactBox||compactBox.height>=fullBox.height-20) throw new Error(`${label}: address mode did not compact panel`)\n            await input.fill('Marsa')\n            const suggestions=page.locator('.movera-st__address-suggestion')\n            await suggestions.first().waitFor({state:'visible',timeout:2500})\n            const suggestionBox=await suggestions.last().boundingBox()\n            const addressPanel=await panel.boundingBox()\n            if(!suggestionBox||!addressPanel||(addressPanel.y+addressPanel.height)-(suggestionBox.y+suggestionBox.height)>34) throw new Error(`${label}: address panel fit failed`)\n            await suggestions.first().click()\n            await page.waitForTimeout(700)\n            if(await popup.getAttribute('data-step')!=='dates') throw new Error(`${label}: address did not advance to dates`)\n            const days=page.locator('.movera-st__day:not([disabled]):not(.movera-st__day--empty)')\n            if(await days.count()<3) throw new Error(`${label}: insufficient selectable calendar days`)\n            await days.nth(0).click()\n            await days.nth(2).click()\n            await page.waitForTimeout(550)\n            const continueButton=page.getByRole('button',{name:/Continuer vers les voyageurs/})\n            if(await continueButton.isDisabled()) throw new Error(`${label}: continue button disabled after valid range`)\n            const datesPanel=await panel.boundingBox(); const continueBox=await continueButton.boundingBox()\n            if(!datesPanel||!continueBox||(datesPanel.y+datesPanel.height)-(continueBox.y+continueBox.height)>34) throw new Error(`${label}: dates panel fit failed`)\n            await continueButton.click()\n            await page.waitForTimeout(650)\n            const finalButton=page.getByRole('button',{name:/Rechercher sur la carte/})\n            const guestsPanel=await panel.boundingBox(); const finalBox=await finalButton.boundingBox()\n            if(!guestsPanel||!finalBox||(guestsPanel.y+guestsPanel.height)-(finalBox.y+finalBox.height)>34) throw new Error(`${label}: guests panel fit failed`)\n"""
          if old not in s: raise SystemExit('CI focus block missing')
          s = s.replace(old, new, 1)
          old_close = """            await page.waitForTimeout(650)\n            if(await popup.count()!==1) throw new Error(`${label}: popup detached before final handoff window`)\n            const lateOpacity=Number(await panel.evaluate(el=>getComputedStyle(el).opacity))\n            if(lateOpacity>0.95) throw new Error(`${label}: final Home handoff did not start near close end`)\n            await popup.waitFor({state:'detached',timeout:1200})\n"""
          new_close = """            await page.waitForTimeout(180)\n            if(await popup.count()!==1) throw new Error(`${label}: popup detached before configured close duration`)\n            await page.waitForTimeout(260)\n            await popup.waitFor({state:'detached',timeout:900})\n"""
          if old_close not in s: raise SystemExit('CI close block missing')
          ci.write_text(s.replace(old_close, new_close, 1))
          PY

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/search-v2.log 2>&1 &
          echo $! > /tmp/search-v2.pid
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4173/Movera-host1/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/search-v2.log; exit 1

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Exact dynamic UAT
        run: |
          cat > /tmp/exact-v2.mjs <<'EOF'
          import { chromium } from 'playwright'
          const base='http://127.0.0.1:4173/Movera-host1/'
          async function verify(label,opts){
            const browser=await chromium.launch({headless:true}); const context=await browser.newContext(opts); const page=await context.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(e.message))
            await page.goto(base,{waitUntil:'networkidle'}); await page.getByTestId('page-home').waitFor(); await page.locator('.b225-search').first().click({position:{x:90,y:25}})
            const popup=page.getByTestId('search-transition'); const panel=page.locator('.movera-st__panel'); const input=page.locator('.movera-st__persistent-search input')
            await popup.waitFor({state:'visible'}); await page.waitForTimeout(1400)
            const lastDestination=page.locator('.movera-st__destination').last(); const db=await lastDestination.boundingBox(); const pb=await panel.boundingBox(); if(!db||!pb) throw new Error(`${label}: destination geometry missing`); if((pb.y+pb.height)-(db.y+db.height)>42) throw new Error(`${label}: destination excess gap`)
            const fullHeight=pb.height; await input.click(); await page.waitForTimeout(500); const compact=await panel.boundingBox(); if(await popup.getAttribute('data-address-mode')!=='true'||!compact||compact.height>=fullHeight-20) throw new Error(`${label}: compact address mode failed`)
            await input.fill('Marsa'); const suggestions=page.locator('.movera-st__address-suggestion'); await suggestions.first().waitFor({state:'visible',timeout:2500}); const sb=await suggestions.last().boundingBox(); const ap=await panel.boundingBox(); if(!sb||!ap||(ap.y+ap.height)-(sb.y+sb.height)>34) throw new Error(`${label}: address fit failed`)
            await suggestions.first().click(); await page.waitForTimeout(700); if(await popup.getAttribute('data-step')!=='dates') throw new Error(`${label}: address -> dates failed`)
            const days=page.locator('.movera-st__day:not([disabled]):not(.movera-st__day--empty)'); if(await days.count()<3) throw new Error(`${label}: insufficient calendar days`); await days.nth(0).click(); await days.nth(2).click(); await page.waitForTimeout(550)
            const next=page.getByRole('button',{name:/Continuer vers les voyageurs/}); if(await next.isDisabled()) throw new Error(`${label}: continue disabled`); const nb=await next.boundingBox(); const dp=await panel.boundingBox(); if(!nb||!dp||(dp.y+dp.height)-(nb.y+nb.height)>34) throw new Error(`${label}: dates fit failed`)
            await next.click(); await page.waitForTimeout(650); const final=page.getByRole('button',{name:/Rechercher sur la carte/}); const fb=await final.boundingBox(); const gp=await panel.boundingBox(); if(!fb||!gp||(gp.y+gp.height)-(fb.y+fb.height)>34) throw new Error(`${label}: guests fit failed`)
            if(errors.length) throw new Error(`${label}: runtime ${errors.join('; ')}`); await browser.close()
          }
          await verify('Desktop',{viewport:{width:390,height:844}})
          await verify('iPhone',{viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:3,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'})
          console.log('PASS exact dynamic UAT')
          EOF
          node /tmp/exact-v2.mjs

      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/search-v2.pid) || true

      - name: Persist validated correction
        run: |
          rm -f .github/workflows/apply-search-exact-fix.yml .github/workflows/apply-search-exact-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/search/SearchTransitionHost.jsx src/features/search/searchTransition-stability.css src/features/search/searchTransition.css src/features/search/searchAddressMode.css .github/workflows/search-motion-targeted-e2e.yml .github/workflows/apply-search-exact-fix.yml .github/workflows/apply-search-exact-fix-v2.yml
          git commit -m "fix(search): exact dynamic fit validated [skip ci]"
          git pull --rebase origin b225-ui-home
          git push
