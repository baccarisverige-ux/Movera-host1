name: Phase 8 Validation
on:
  push:
    branches: [phase8-carousel-independent]
  pull_request:
    branches: [phase7-marker-system]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/movera-preview.log 2>&1 &
          echo $! > /tmp/movera-preview.pid
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:4173/carousel-lab >/dev/null && exit 0; sleep 1; done
          cat /tmp/movera-preview.log; exit 1
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Carousel isolated gestures scroll and resize gate
        run: |
          cat > phase8-smoke.mjs <<'EOF'
          import { chromium } from 'playwright'
          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } })
          const errors = []
          page.on('pageerror', e => errors.push(e.message))
          await page.goto('http://127.0.0.1:4173/carousel-lab')
          const shell = page.locator('[data-testid="carousel-shell"]')
          await shell.waitFor()
          if (await page.locator('[data-testid="map-engine"]').count()) throw new Error('Carousel isolation failed: map present')
          if ((await shell.getAttribute('data-carousel-state')) !== 'closed') throw new Error('Initial state must be closed')

          await page.locator('[data-testid="carousel-open"]').click()
          await page.waitForTimeout(140)
          if ((await shell.getAttribute('data-carousel-state')) !== 'open') throw new Error('Open state failed')
          const track = page.locator('[data-testid="carousel-track"]')
          if (Number(await track.getAttribute('data-listing-index')) !== 0) throw new Error('Initial listing index invalid')

          await page.getByRole('button', { name: 'Offre suivante' }).click()
          if (Number(await track.getAttribute('data-listing-index')) !== 1) throw new Error('Next control failed')
          await page.getByRole('button', { name: 'Offre précédente' }).click()
          if (Number(await track.getAttribute('data-listing-index')) !== 0) throw new Error('Previous control failed')

          const gesture = page.locator('[data-testid="carousel-gesture"]')
          await gesture.evaluate((el) => {
            const fire = (type, x, y) => el.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 41, pointerType: 'touch', clientX: x, clientY: y, isPrimary: true }))
            fire('pointerdown', 300, 360); fire('pointerup', 120, 362)
          })
          await page.waitForTimeout(80)
          if (Number(await track.getAttribute('data-listing-index')) !== 1) throw new Error('Listing swipe failed')

          const imageBefore = Number(await track.getAttribute('data-image-index'))
          await gesture.evaluate((el) => {
            const fire = (type, x, y) => el.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 42, pointerType: 'touch', clientX: x, clientY: y, isPrimary: true }))
            fire('pointerdown', 210, 470); fire('pointerup', 212, 280)
          })
          await page.waitForTimeout(80)
          const imageAfter = Number(await track.getAttribute('data-image-index'))
          if (imageAfter <= imageBefore) throw new Error('Photo swipe failed')
          const pagerLabel = await page.locator('[data-testid="carousel-image-pager"]').getAttribute('aria-label')
          if (!pagerLabel?.includes(`Image ${imageAfter + 1}`)) throw new Error('Image pager mismatch')

          const scrollBefore = await page.evaluate(() => window.scrollY)
          await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight))
          await page.waitForTimeout(80)
          const scrollAfter = await page.evaluate(() => window.scrollY)
          if (scrollAfter <= scrollBefore) throw new Error('Carousel blocks page scroll')

          for (const viewport of [{ width: 320, height: 700 }, { width: 375, height: 812 }, { width: 430, height: 900 }, { width: 768, height: 900 }, { width: 1024, height: 900 }]) {
            await page.setViewportSize(viewport)
            await page.waitForTimeout(60)
            const box = await page.locator('.carousel-slide').boundingBox()
            if (!box || box.width > viewport.width + 1 || box.width < 250) throw new Error(`Resize failed at ${viewport.width}`)
          }

          await page.getByRole('button', { name: 'Fermer le carousel' }).click()
          await page.waitForTimeout(140)
          if ((await shell.getAttribute('data-carousel-state')) !== 'closed') throw new Error('Close state failed')
          if (errors.length) throw new Error(errors.join(' | '))
          await browser.close()
          EOF
          node phase8-smoke.mjs
      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/movera-preview.pid) || true
