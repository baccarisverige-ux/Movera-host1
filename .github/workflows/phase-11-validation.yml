name: Phase 11 Validation
on:
  push:
    branches: [phase11-listing-detail]
  pull_request:
    branches: [phase10-map-carousel-integration]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/movera-preview.log 2>&1 &
          echo $! > /tmp/movera-preview.pid
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:4173/listing/marsa-sea >/dev/null && exit 0; sleep 1; done
          cat /tmp/movera-preview.log; exit 1
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Listing detail E2E gate
        run: |
          cat > phase11-smoke.mjs <<'EOF'
          import { chromium } from 'playwright'
          const browser = await chromium.launch({ headless: true })
          const errors = []
          for (const width of [320,375,390,430,768,1024]) {
            const page = await browser.newPage({ viewport: { width, height: 844 } })
            page.on('pageerror', e => errors.push(`${width}:${e.message}`))
            await page.goto('http://127.0.0.1:4173/listing/marsa-sea')
            await page.getByTestId('page-listing').waitFor()
            for (const id of ['listing-gallery','listing-header','listing-location','listing-amenities','listing-host-card','listing-availability','listing-pricing-summary']) {
              if (!(await page.getByTestId(id).isVisible())) throw new Error(`${id} not visible at ${width}`)
            }
            const gallery = page.getByTestId('listing-gallery')
            if ((await gallery.getAttribute('data-image-index')) !== '0') throw new Error('Gallery initial index invalid')
            await page.getByRole('button',{name:'Photo suivante'}).click()
            if ((await gallery.getAttribute('data-image-index')) !== '1') throw new Error('Gallery next failed')
            await page.getByRole('button',{name:'Photo précédente'}).click()
            if ((await gallery.getAttribute('data-image-index')) !== '0') throw new Error('Gallery previous failed')
            const img = page.getByTestId('listing-image')
            if ((await img.getAttribute('loading')) !== 'lazy') throw new Error('Lazy loading missing')
            await page.getByTestId('booking-cta').click()
            await page.waitForURL(/\/booking\/marsa-sea$/)
            await page.close()
          }

          const fallback = await browser.newPage({ viewport: { width: 390, height: 844 } })
          await fallback.goto('http://127.0.0.1:4173/listing/marsa-sea?mediaError=1')
          await fallback.getByTestId('listing-image-fallback').waitFor()
          if (!(await fallback.getByTestId('listing-image-fallback').isVisible())) throw new Error('Image fallback not visible')
          await fallback.close()

          const missing = await browser.newPage({ viewport: { width: 390, height: 844 } })
          await missing.goto('http://127.0.0.1:4173/listing/not-found-id')
          await missing.getByTestId('page-listing-missing').waitFor()
          if (!(await missing.getByTestId('page-listing-missing').isVisible())) throw new Error('Missing listing state failed')
          await missing.close()

          if (errors.length) throw new Error(errors.join(' | '))
          await browser.close()
          EOF
          node phase11-smoke.mjs
      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/movera-preview.pid) || true
