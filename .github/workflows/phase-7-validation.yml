name: Phase 7 Validation
on:
  push:
    branches: [phase7-marker-system]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/movera-preview.log 2>&1 &
          echo $! > /tmp/movera-preview.pid
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:4173/map >/dev/null && exit 0; sleep 1; done
          cat /tmp/movera-preview.log; exit 1
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Marker selection clusters legacy-path and recenter gate
        run: |
          cat > phase7-smoke.mjs <<'EOF'
          import { chromium } from 'playwright'
          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } })
          const errors = []
          page.on('pageerror', e => errors.push(e.message))
          await page.goto('http://127.0.0.1:4173/map')
          const surface = page.locator('[data-testid="map-surface"]')
          await surface.waitFor()
          const startUrl = page.url()
          const first = page.locator('[data-testid="map-marker-tunis-centre"]')
          await first.click()
          await page.waitForTimeout(120)
          if ((await page.locator('[data-marker-state="selected"]').count()) !== 1) throw new Error('Selection must be unique')
          if ((await page.locator('[data-testid="map-engine"]').getAttribute('data-selected-listing-id')) !== 'tunis-centre') throw new Error('selectedListingId state mismatch')
          if (page.url() !== startUrl) throw new Error('Legacy navigation path triggered')
          const lat1 = Number(await surface.getAttribute('data-lat'))
          const lng1 = Number(await surface.getAttribute('data-lng'))
          if (Math.abs(lat1 - 36.8065) > .001 || Math.abs(lng1 - 10.1815) > .001) throw new Error('Recenter mismatch')
          const second = page.locator('[data-testid="map-marker-carthage"]')
          await second.click()
          await page.waitForTimeout(120)
          if ((await page.locator('[data-marker-state="selected"]').count()) !== 1) throw new Error('Multiple markers selected')
          if ((await page.locator('[data-testid="map-engine"]').getAttribute('data-selected-listing-id')) !== 'carthage') throw new Error('Second selection failed')
          if (page.url() !== startUrl) throw new Error('Old route triggered after second selection')
          await page.getByRole('button', { name: 'Réinitialiser la carte' }).click()
          await page.waitForTimeout(100)
          await page.getByRole('button', { name: 'Zoom arrière' }).click()
          await page.waitForTimeout(100)
          const cluster = page.locator('[data-testid="map-cluster"]')
          await cluster.waitFor()
          if (Number(await page.locator('[data-testid="map-cluster-layer"]').getAttribute('data-cluster-size')) !== 4) throw new Error('Cluster count incorrect')
          await cluster.click()
          await page.waitForTimeout(100)
          if (page.url() !== startUrl) throw new Error('Cluster triggered navigation')
          if (Number(await surface.getAttribute('data-zoom')) < 11) throw new Error('Cluster recenter zoom unstable')
          if (errors.length) throw new Error(errors.join(' | '))
          await browser.close()
          EOF
          node phase7-smoke.mjs
      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/movera-preview.pid) || true
