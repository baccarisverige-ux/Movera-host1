name: Search Motion Targeted E2E
on:
  push:
    branches: [b225-ui-home]
    paths-ignore:
      - docs/ci/search-motion-status.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair stale Prestige CSS source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/styles/home-b225-block3.css')
          s = p.read_text()
          marker = '.b225-categories button:nth-child(5)>span{'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('Prestige legacy span selector not found')
          tail = s[start:]
          replacement = '.b225-categories button:nth-child(5)>span{background:transparent}'
          if 'data:image/png;base64' not in tail:
              print('Prestige legacy CSS already clean')
          else:
              end = s.find('}', start)
              if end < 0:
                  s = s[:start] + replacement + '\n'
              else:
                  s = s[:start] + replacement + s[end + 1:]
              p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/movera-search-motion.log 2>&1 &
          echo $! > /tmp/movera-search-motion.pid
          for i in {1..25}; do curl --fail --silent http://127.0.0.1:4173/Movera-host1/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/movera-search-motion.log; exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: E2E UAT open close desktop and iPhone
        id: motion_test
        continue-on-error: true
        run: |
          cat > search-motion-targeted.mjs <<'EOF'
          import { chromium } from 'playwright'
          const base='http://127.0.0.1:4173/Movera-host1/'

          async function run(label, contextOptions) {
            const browser=await chromium.launch({headless:true})
            const context=await browser.newContext(contextOptions)
            const page=await context.newPage()
            const runtimeErrors=[]
            page.on('pageerror',e=>runtimeErrors.push(e.message))
            await page.goto(base,{waitUntil:'networkidle'})
            await page.getByTestId('page-home').waitFor()
            const trigger=page.locator('.b225-search').first()
            await trigger.click({position:{x:80,y:25}})
            const popup=page.getByTestId('search-transition')
            const panel=page.locator('.movera-st__panel')
            const input=page.locator('.movera-st__destination-search input')
            await popup.waitFor({state:'visible'})

            await page.waitForTimeout(250)
            const autoFocused=await input.evaluate(el=>document.activeElement===el)
            if(autoFocused) throw new Error(`${label}: destination input auto-focused on open`)

            const earlyBox=await panel.boundingBox()
            await page.waitForTimeout(500)
            const midBox=await panel.boundingBox()
            if(!earlyBox||!midBox) throw new Error(`${label}: panel missing during opening`)
            if(Math.abs(midBox.height-earlyBox.height)<8) throw new Error(`${label}: opening is not visibly progressive`)

            await page.waitForTimeout(1050)
            const finalBox=await panel.boundingBox()
            const cssHeight=Number((await popup.evaluate(el=>getComputedStyle(el).getPropertyValue('--st-panel-height'))).replace('px',''))
            if(!finalBox||Math.abs(finalBox.height-cssHeight)>3) throw new Error(`${label}: opening did not settle ${finalBox?.height}/${cssHeight}`)
            if(Number(await page.locator('.movera-st__content').evaluate(el=>getComputedStyle(el).opacity))<0.99) throw new Error(`${label}: content not visible after open`)
            if(await input.evaluate(el=>document.activeElement===el)) throw new Error(`${label}: input focused without explicit user tap`)

            await input.click()
            if(!await input.evaluate(el=>document.activeElement===el)) throw new Error(`${label}: intentional input focus failed`)
            await input.blur()
            await page.waitForTimeout(500)

            await page.getByRole('button',{name:'Fermer'}).click()
            await page.waitForTimeout(650)
            if(await popup.count()!==1) throw new Error(`${label}: popup detached too early during close`)
            const closeMidOpacity=Number(await panel.evaluate(el=>getComputedStyle(el).opacity))
            if(closeMidOpacity<0.85) throw new Error(`${label}: panel faded too early during close (${closeMidOpacity})`)
            const closeMidBox=await panel.boundingBox()
            if(!closeMidBox) throw new Error(`${label}: panel missing mid-close`)
            if(Math.abs(closeMidBox.height-finalBox.height)<8) throw new Error(`${label}: close reverse motion is not visibly progressing`)

            await page.waitForTimeout(650)
            if(await popup.count()!==1) throw new Error(`${label}: popup detached before final handoff window`)
            const lateOpacity=Number(await panel.evaluate(el=>getComputedStyle(el).opacity))
            if(lateOpacity>0.95) throw new Error(`${label}: final Home handoff did not start near close end`)
            await popup.waitFor({state:'detached',timeout:1200})
            await page.getByTestId('page-home').waitFor()
            if(runtimeErrors.length) throw new Error(`${label}: runtime errors: ${runtimeErrors.join('; ')}`)
            await browser.close()
          }

          await run('Desktop',{viewport:{width:390,height:844}})
          await run('iPhone',{viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:3,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'})
          console.log('PASS: Search open/close targeted E2E/UAT desktop + iPhone')
          EOF
          node search-motion-targeted.mjs
      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/movera-search-motion.pid) || true
      - name: Publish searchable test status and CSS repair
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.motion_test.outcome }}
          TEST_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p docs/ci
          if [ "$TEST_OUTCOME" = "success" ]; then STATUS=PASS; else STATUS=FAIL; fi
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"status":"%s","tested_sha":"%s","run_id":"%s","updated_at":"%s"}\n' "$STATUS" "$TEST_SHA" "$RUN_ID" "$NOW" > docs/ci/search-motion-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ci/search-motion-status.json src/styles/home-b225-block3.css
          git commit -m "fix(home): persist repaired legacy CSS tail [skip ci]" || exit 0
          git pull --rebase origin b225-ui-home
          git push
      - name: Enforce targeted result
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.motion_test.outcome }}
        run: test "$TEST_OUTCOME" = "success"
