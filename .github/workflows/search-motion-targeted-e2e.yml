name: Home Floating Map CTA Source Patch

on:
  push:
    branches: [b225-ui-home]
    paths:
      - src/features/home/.cta-cleanup-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci(home): trigger floating CTA source patch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove floating CTA and all dedicated source code
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          home = Path('src/features/home/HomePage.jsx')
          source = home.read_text()
          source, count = re.subn(r'\n\s*<button className="b225-map-cta"[^\n]*?</button>', '', source, count=1)
          if count != 1:
              raise SystemExit(f'Expected one Home CTA, removed {count}')
          home.write_text(source)

          css = Path('src/styles/home-b225.css')
          styles = css.read_text()
          styles, count = re.subn(r'\.b225-map-cta\{[^}]*\}\.b225-map-cta svg\{[^}]*\}', '', styles, count=1)
          if count != 1:
              raise SystemExit(f'Expected one CTA CSS block, removed {count}')
          styles, count = re.subn(r'(\.b225-home\{[^}]*?padding:)0 0 118px', r'\g<1>0 0 84px', styles, count=1)
          if count != 1:
              raise SystemExit(f'Expected Home CTA bottom-space rule, changed {count}')
          css.write_text(styles)

          Path('src/features/home/.cta-cleanup-trigger').unlink(missing_ok=True)
          PY

          ! grep -R "b225-map-cta\|home-map-cta" src

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Commit validated source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/home/HomePage.jsx src/styles/home-b225.css src/features/home/.cta-cleanup-trigger
          git commit -m "fix(home): remove floating map CTA and dedicated code"
          git pull --rebase origin b225-ui-home
          git push origin HEAD:b225-ui-home
