name: Phase 16 Validation
on:
  push:
    branches: [phase16-responsive-accessibility]
  pull_request:
    branches: [phase15-error-offline-resilience]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/movera-preview.log 2>&1 &
          echo $! > /tmp/movera-preview.pid
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/movera-preview.log; exit 1
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Phase 16 responsive accessibility gate
        run: |
          cat > phase16-smoke.mjs <<'EOF'
          import { chromium } from 'playwright'
          const browser=await chromium.launch({headless:true})
          const sizes=[[320,568],[360,740],[375,812],[390,844],[393,852],[414,896],[430,932],[768,1024],[1024,768]]
          const routes=['/','/map','/listing/marsa-sea','/booking/marsa-sea','/host']
          for(const [width,height] of sizes){
            const page=await browser.newPage({viewport:{width,height}})
            for(const route of routes){
              await page.goto(`http://127.0.0.1:4173${route}`)
              const overflow=await page.evaluate(()=>Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-window.innerWidth)
              if(overflow>1) throw new Error(`critical horizontal overflow ${route} @ ${width}x${height}: ${overflow}px`)
            }
            await page.close()
          }
          const page=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'})
          await page.goto('http://127.0.0.1:4173/')
          const nav=page.locator('.app-shell__nav-item').first()
          const box=await nav.boundingBox(); if(!box||box.height<44) throw new Error('touch target under 44px')
          if((await page.locator('[aria-current="page"]').count())<1) throw new Error('aria-current missing')
          const tabIndex=await nav.evaluate(e=>e.tabIndex); if(tabIndex<0) throw new Error('navigation not keyboard-focusable')
          await nav.focus()
          const focusVisible=await nav.evaluate(e=>{const s=getComputedStyle(e);return document.activeElement===e&&s.outlineStyle!=='none'&&parseFloat(s.outlineWidth)>0})
          if(!focusVisible) throw new Error('keyboard focus not visible')
          const motion=await page.locator('.home-card').first().evaluate(e=>{const s=getComputedStyle(e);return {a:s.animationDuration,t:s.transitionDuration}})
          const maxDuration=(v)=>Math.max(...v.split(',').map(x=>parseFloat(x)||0))
          if(maxDuration(motion.a)>0.02||maxDuration(motion.t)>0.02) throw new Error('reduced motion not enforced')
          const safeArea=await page.locator('.app-shell__nav').evaluate(e=>getComputedStyle(e).paddingBottom)
          if(parseFloat(safeArea)<1) throw new Error('bottom safe-area padding missing')
          await page.setViewportSize({width:844,height:390})
          await page.goto('http://127.0.0.1:4173/')
          const landscapeOverflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth)
          if(landscapeOverflow>1) throw new Error('landscape overflow')
          await browser.close()
          EOF
          node phase16-smoke.mjs
      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/movera-preview.pid) || true
