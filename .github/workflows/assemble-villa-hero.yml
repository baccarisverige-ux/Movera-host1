name: Assemble Villa Hero

on:
  push:
    paths:
      - '.tmp-villa/hq*.b64'
      - '.github/workflows/assemble-villa-hero.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assemble high-quality Villa hero
        run: |
          cat .tmp-villa/hq00.b64 \
              .tmp-villa/hq01.b64 \
              .tmp-villa/hq02.b64 \
              .tmp-villa/hq03.b64 \
              .tmp-villa/hq04.b64 \
              .tmp-villa/hq05.b64 \
              .tmp-villa/hq06.b64 | base64 -d > src/features/villa/assets/hero.webp
          test "$(stat -c %s src/features/villa/assets/hero.webp)" -eq 56566
          echo "42df873c4a3c0688d6041f1085ebcbd52f0ddde94f9edf0c663d5ad35bea37a7  src/features/villa/assets/hero.webp" | sha256sum -c -
          file src/features/villa/assets/hero.webp | grep -qi 'Web/P image'
      - name: Commit hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/villa/assets/hero.webp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: restore high-quality Villa hero"
          git push
