name: Apply isolated Search step Motion

on:
  push:
    branches: [b225-ui-home]
    paths:
      - .github/workflows/apply-search-step-motion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Motion as an isolated runtime dependency
        run: npm install motion@latest --save
      - name: Wire Motion wrapper without touching popup open-close CSS
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/features/search/SearchTransitionHost.jsx')
          s = p.read_text()

          calendar_import = "import { SearchCalendar } from './SearchCalendar.jsx'"
          motion_import = "import { SearchStepMotion } from './SearchStepMotion.jsx'"
          if motion_import not in s:
              s = s.replace(calendar_import, calendar_import + "\n" + motion_import)

          stability_import = "import './searchTransition-stability.css'"
          fit_import = "import './searchStepFit.css'"
          if fit_import not in s:
              s = s.replace(stability_import, stability_import + "\n" + fit_import)

          body_open = '          <div className="movera-st__body">\n'
          motion_open = body_open + '            <SearchStepMotion step={step}>\n'
          if '<SearchStepMotion step={step}>' not in s:
              if body_open not in s:
                  raise SystemExit('Search body opening marker not found')
              s = s.replace(body_open, motion_open, 1)

              tail = '          </div>\n        </div>\n      </section>'
              idx = s.rfind(tail)
              if idx < 0:
                  raise SystemExit('Search body closing marker not found')
              s = s[:idx] + '            </SearchStepMotion>\n' + s[idx:]

          p.write_text(s)
          PY
      - name: Verify isolated integration
        run: |
          grep -q "from 'motion/react'" src/features/search/SearchStepMotion.jsx
          grep -q "SearchStepMotion step={step}" src/features/search/SearchTransitionHost.jsx
          grep -q "searchStepFit.css" src/features/search/SearchTransitionHost.jsx
          grep -q '"motion"' package.json
      - run: npm run lint
      - run: npm run build
      - name: Persist only after successful lint and build
        run: |
          rm .github/workflows/apply-search-step-motion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/features/search/SearchTransitionHost.jsx src/features/search/SearchStepMotion.jsx src/features/search/searchStepFit.css .github/workflows/apply-search-step-motion.yml
          git commit -m "feat(search): add isolated Motion step transitions [skip ci]"
          git pull --rebase origin b225-ui-home
          git push
