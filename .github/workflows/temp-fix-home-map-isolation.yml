name: Fix Home Map CSS isolation

on:
  push:
    branches:
      - b225-ui-home
    paths:
      - .github/workflows/temp-fix-home-map-isolation.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b225-ui-home
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Isolate Home search from Map CSS
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('src/features/home/HomePage.jsx')
          text = home.read_text()

          map_import = "import '../../styles/map-b225.css'\n"
          if map_import not in text:
              raise SystemExit('map-b225.css import missing from HomePage; aborting safe patch')
          text = text.replace(map_import, '', 1)

          home_css_import = "import '../../styles/home-map-search-copy.css'\n"
          anchor = "import '../../styles/home-b225-block3.css'\n"
          if home_css_import not in text:
              if anchor not in text:
                  raise SystemExit('Home CSS anchor missing')
              text = text.replace(anchor, anchor + home_css_import, 1)

          old = '''<label className="b225-search b225-map-search" aria-label="Rechercher une destination"><SearchIcon/><span className="b225-map-search__copy"><strong>Explorez autrement</strong><span>Destination · Dates · Voyageurs</span></span><input data-testid="home-search" type="search" value={query} onChange={e=>setQuery(e.target.value)} aria-label="Destination"/><span className="b225-map-filter-button" aria-hidden="true">≡</span></label>'''
          new = '''<label className="b225-search b225-home-map-search" aria-label="Rechercher une destination"><SearchIcon/><span className="b225-home-map-search__copy"><strong>Explorez autrement</strong><span>Destination · Dates · Voyageurs</span></span><input data-testid="home-search" type="search" value={query} onChange={e=>setQuery(e.target.value)} aria-label="Destination"/><span className="b225-home-map-filter-button" aria-hidden="true">≡</span></label>'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exact Home search markup once, found {text.count(old)}')
          text = text.replace(old, new, 1)
          home.write_text(text)

          main = Path('src/main.jsx')
          main_text = main.read_text()
          main_text = main_text.replace("import './styles/home-map-search-copy.css'\n", '', 1)
          main.write_text(main_text)

          css = Path('src/styles/home-map-search-copy.css')
          css.write_text('''.b225-home .b225-search.b225-home-map-search{pointer-events:auto;height:52px;border:1px solid rgba(0,0,0,.06);border-radius:999px;background:rgba(255,255,255,.95);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);display:flex;align-items:center;gap:10px;padding:0 10px 0 17px;box-shadow:0 8px 26px rgba(25,28,26,.12);margin-inline:-4px;width:calc(100% + 8px);overflow:hidden}\n.b225-home .b225-search.b225-home-map-search:active{transform:none}\n.b225-home .b225-search.b225-home-map-search:focus-within{box-shadow:0 8px 26px rgba(25,28,26,.12)}\n.b225-home .b225-home-map-search>svg{width:18px;height:18px;fill:none;stroke:#202221;stroke-width:2;flex:none}\n.b225-home .b225-home-map-search__copy{min-width:0;display:grid;gap:1px;flex:1;pointer-events:none}\n.b225-home .b225-home-map-search__copy strong{font-size:13px;font-weight:760;letter-spacing:-.15px;color:#171817;line-height:normal}\n.b225-home .b225-home-map-search__copy span{font-size:10.5px;color:#747875;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:normal}\n.b225-home .b225-home-map-filter-button{width:38px;height:38px;flex:0 0 38px;border:1px solid #eceeed;border-radius:50%;background:#fff;display:grid;place-items:center;color:#232523;font-size:17px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.04);pointer-events:none}\n@media(max-width:350px){.b225-home .b225-search.b225-home-map-search{height:49px}}\n''')

          Path('.github/workflows/temp-fix-home-map-isolation.yml').unlink()
          PY

      - name: Verify build and CSS isolation
        run: |
          npm ci
          npm run lint
          npm run build
          test -f dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -name 'MapPage-*.css' -print -quit)"
          ! grep -q "styles/map-b225.css" src/features/home/HomePage.jsx
          grep -q "styles/map-b225.css" src/features/map/MapPage.jsx
          grep -q "b225-home-map-search" src/features/home/HomePage.jsx

      - name: Commit isolated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/home/HomePage.jsx src/main.jsx src/styles/home-map-search-copy.css .github/workflows/temp-fix-home-map-isolation.yml
          git commit -m "fix(home): isolate copied search bar from Map CSS"
          git pull --rebase origin b225-ui-home
          git push origin HEAD:b225-ui-home
