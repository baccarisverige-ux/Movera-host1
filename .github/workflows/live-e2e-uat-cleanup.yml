name: Live E2E UAT Cleanup Audit

on:
  push:
    branches: [b225-ui-home]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-e2e-uat-cleanup
  cancel-in-progress: true

jobs:
  quality-and-cleanup-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Architecture guard
        run: npm run quality:architecture
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Legacy cleanup audit
        run: node scripts/audit-live-cleanup.mjs

  search-e2e-uat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Search E2E / UAT / cleanup safety
        run: npx --yes @playwright/test@1.55.0 test tests/e2e/search-uat-cleanup.spec.js --project=mobile-chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-search-e2e-uat-report
          path: playwright-report
          if-no-files-found: ignore
