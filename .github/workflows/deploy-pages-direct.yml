name: Deploy Movera Host + Rider + Driver to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Movera Host
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Host dependencies
        run: npm ci

      - name: Lint Host
        run: npm run lint

      - name: Build Host
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.h131189 }}
        run: npm run build

      - name: Add Host SPA route fallback
        run: cp dist/index.html dist/404.html

      - name: Checkout Movera Rider
        uses: actions/checkout@v4
        with:
          repository: baccarisverige-ux/-movera-rider
          ref: main
          path: external/rider

      - name: Checkout Movera Driver
        uses: actions/checkout@v4
        with:
          repository: baccarisverige-ux/-movera-driver
          ref: main
          path: external/driver

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Inject Maps loader into Flutter web shells
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.h131189 }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          key = os.environ['GOOGLE_MAPS_API_KEY']
          if not key:
              raise SystemExit('Google Maps API key secret is empty')

          loader = f'  <script src="https://maps.googleapis.com/maps/api/js?key={key}"></script>\n'
          for rel in ('external/rider/web/index.html', 'external/driver/web/index.html'):
              p = Path(rel)
              text = p.read_text()
              if 'maps.googleapis.com/maps/api/js' not in text:
                  text = text.replace('</head>', loader + '</head>')
              p.write_text(text)
          PY

      - name: Build Rider web with Maps
        working-directory: external/rider
        run: |
          flutter pub get
          flutter build web --release --pwa-strategy=none --base-href /Movera-host1/rider/
          mkdir -p ../../dist/rider
          cp -a build/web/. ../../dist/rider/
          cp ../../dist/rider/index.html ../../dist/rider/404.html

      - name: Build Driver web with Maps
        working-directory: external/driver
        run: |
          flutter pub get
          flutter build web --release --pwa-strategy=none --base-href /Movera-host1/driver/
          mkdir -p ../../dist/driver
          cp -a build/web/. ../../dist/driver/
          cp ../../dist/driver/index.html ../../dist/driver/404.html

      - name: Verify compiled output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -d dist/assets
          test -f dist/rider/index.html
          test -f dist/rider/main.dart.js
          test -f dist/driver/index.html
          test -f dist/driver/main.dart.js
          grep -q 'maps.googleapis.com/maps/api/js' dist/rider/index.html
          grep -q 'maps.googleapis.com/maps/api/js' dist/driver/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful Pages deployment
        env:
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs/ci
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"status":"PASS","deployed_sha":"%s","updated_at":"%s"}\n' "$DEPLOYED_SHA" "$NOW" > docs/ci/pages-deploy-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ci/pages-deploy-status.json
          git commit -m "ci: record Pages deployment [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
