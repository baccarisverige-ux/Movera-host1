name: Finalize Home CTA removal

on:
  push:
    branches:
      - b225-ui-home
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event_name == 'push' && github.event.head_commit.message == 'ci(home): finalize floating CTA removal'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove obsolete floating CTA completely
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          home = Path('src/features/home/HomePage.jsx')
          s = home.read_text()
          s, n = re.subn(r'\n\s*<button className="b225-map-cta"[^\n]*?</button>', '', s, count=1)
          if n != 1:
              raise SystemExit(f'Home CTA markup removal count={n}')
          home.write_text(s)

          css = Path('src/styles/home-b225.css')
          s = css.read_text()
          s, n = re.subn(r'\.b225-map-cta\{[^}]*\}\.b225-map-cta svg\{[^}]*\}', '', s, count=1)
          if n != 1:
              raise SystemExit(f'CTA CSS removal count={n}')
          s, n = re.subn(r'(\.b225-home\{[^}]*?padding:)0 0 118px', r'\g<1>0 0 84px', s, count=1)
          if n != 1:
              raise SystemExit(f'Home bottom padding adjustment count={n}')
          css.write_text(s)
          PY

          ! grep -R "b225-map-cta\|home-map-cta" src

      - name: Restore normal CI files
        run: |
          git show 09a4fc69807fc5aac391920c37019200d87747db:.github/workflows/deploy-pages-direct.yml > .github/workflows/deploy-pages-direct.yml
          git show 09a4fc69807fc5aac391920c37019200d87747db:.github/workflows/quality.yml > .github/workflows/quality.yml
          rm -f .github/workflows/remove-home-map-cta.yml

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Persist validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/home/HomePage.jsx src/styles/home-b225.css .github/workflows/deploy-pages-direct.yml .github/workflows/quality.yml .github/workflows/remove-home-map-cta.yml
          git commit -m "fix(home): remove floating map CTA"
          git pull --rebase origin b225-ui-home
          git push origin HEAD:b225-ui-home
