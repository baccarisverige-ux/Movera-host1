name: Search V2 CodeQL

on:
  push:
    branches: [phase-11-search-v2-validation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Analyze
        uses: github/codeql-action/analyze@v3
