name: Apply exact Map search bar to Home

on:
  push:
    branches:
      - b225-ui-home
    paths:
      - .github/workflows/temp-copy-map-search-home.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b225-ui-home
          fetch-depth: 0

      - name: Copy Map search bar styling and markup to Home
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/home/HomePage.jsx')
          text = path.read_text()

          import_anchor = "import '../../styles/home-b225-block3.css'\n"
          map_import = "import '../../styles/map-b225.css'\n"
          if map_import not in text:
              if import_anchor not in text:
                  raise SystemExit('Home CSS import anchor not found')
              text = text.replace(import_anchor, import_anchor + map_import, 1)

          old = '''<label className="b225-search" aria-label="Rechercher une destination"><SearchIcon/><span className="b225-search__copy"><strong>Où allez-vous ?</strong><span>Destination · Dates · Voyageurs</span></span><input data-testid="home-search" type="search" value={query} onChange={e=>setQuery(e.target.value)} aria-label="Destination"/><button type="button" className="b225-ai" aria-label="Assistant IA" onClick={()=>onNavigate('/messages')}>✦</button></label>'''
          new = '''<label className="b225-search b225-map-search" aria-label="Rechercher une destination"><SearchIcon/><span className="b225-map-search__copy"><strong>Explorez autrement</strong><span>Destination · Dates · Voyageurs</span></span><input data-testid="home-search" type="search" value={query} onChange={e=>setQuery(e.target.value)} aria-label="Destination"/><span className="b225-map-filter-button" aria-hidden="true">≡</span></label>'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one Home search bar, found {count}')
          path.write_text(text.replace(old, new, 1))

          css_path = Path('src/styles/home-map-search-copy.css')
          css_path.write_text(".b225-home .b225-search.b225-map-search{margin-inline:-4px;width:calc(100% + 8px)}.b225-home .b225-search.b225-map-search:active{transform:none}\n")

          main_path = Path('src/main.jsx')
          main = main_path.read_text()
          home_copy_import = "import './styles/home-map-search-copy.css'\n"
          if home_copy_import not in main:
              anchor = "import './styles/welcome-tunisia-map.css'\n"
              if anchor not in main:
                  raise SystemExit('main.jsx style import anchor not found')
              main_path.write_text(main.replace(anchor, anchor + home_copy_import, 1))

          Path('.github/workflows/temp-copy-map-search-home.yml').unlink()
          PY

      - name: Commit Home search copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/home/HomePage.jsx src/main.jsx src/styles/home-map-search-copy.css .github/workflows/temp-copy-map-search-home.yml
          git commit -m "ui(home): copy Map search bar with Explorez autrement"
          git push origin HEAD:b225-ui-home
