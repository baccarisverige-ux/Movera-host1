name: Apply native Tunisia map button fix

on:
  push:
    branches:
      - b225-ui-home
    paths:
      - .github/workflows/temp-home-map-native-button.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b225-ui-home
          fetch-depth: 0
      - name: Replace visual div with native React button
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/home/HomePage.jsx')
          text = path.read_text()
          old = '<div className="b225-welcome__visual" aria-hidden="true"><span>MH</span></div>'
          new = '<button type="button" className="b225-welcome__visual" aria-label="Explorer la carte de Tunisie" onClick={()=>onNavigate(\'/map\')}><span aria-hidden="true">MH</span></button>'
          if old not in text:
              raise SystemExit('Expected Tunisia visual markup not found; refusing unsafe edit')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one Tunisia visual markup, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/temp-home-map-native-button.yml')
          workflow.unlink()
          PY
      - name: Commit exact fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/home/HomePage.jsx .github/workflows/temp-home-map-native-button.yml
          git commit -m "fix(home): make Tunisia map a native React button [skip ci]"
          git push origin HEAD:b225-ui-home
