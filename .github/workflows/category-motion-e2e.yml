name: Category Motion E2E

on:
  push:
    branches:
      - feat/category-motion
    paths:
      - package.json
      - src/pages/Home/HomePage.jsx
      - src/mocks/homeData.js
      - src/styles/home-b225.css
      - .github/workflows/category-motion-e2e.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  categories-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          : > category-motion-e2e-result.txt
          echo 'INSTALL=START' >> category-motion-e2e-result.txt
          npm install --no-audit --no-fund
          echo 'INSTALL=PASS' >> category-motion-e2e-result.txt

      - name: Lint
        run: |
          echo 'LINT=START' >> category-motion-e2e-result.txt
          npm run lint
          echo 'LINT=PASS' >> category-motion-e2e-result.txt

      - name: Build
        run: |
          echo 'BUILD=START' >> category-motion-e2e-result.txt
          npm run build
          echo 'BUILD=PASS' >> category-motion-e2e-result.txt

      - name: Start preview
        run: |
          echo 'PREVIEW=START' >> category-motion-e2e-result.txt
          npm run preview -- --host 127.0.0.1 > /tmp/movera-category-preview.log 2>&1 &
          echo $! > /tmp/movera-category-preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/Movera-host1/ >/dev/null; then
              echo 'PREVIEW=PASS' >> category-motion-e2e-result.txt
              exit 0
            fi
            sleep 1
          done
          tail -80 /tmp/movera-category-preview.log >> category-motion-e2e-result.txt || true
          exit 1

      - name: Install Playwright Chromium
        run: |
          echo 'BROWSER_INSTALL=START' >> category-motion-e2e-result.txt
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          echo 'BROWSER_INSTALL=PASS' >> category-motion-e2e-result.txt

      - name: Categories E2E
        run: |
          echo 'E2E=START' >> category-motion-e2e-result.txt
          cat > category-e2e.mjs <<'EOF'
          import { chromium } from 'playwright'

          const expected = [
            { label: 'Tout', count: 8 },
            { label: 'Maison d’hôte', count: 4 },
            { label: 'Plage', count: 4 },
            { label: 'Famille', count: 1 },
            { label: 'Prestige', count: 4 },
            { label: 'Expérience', count: 0 },
            { label: 'Partenaire', count: 0 },
          ]

          const browser = await chromium.launch({ headless: true })
          const viewports = [
            { width: 390, height: 844, name: 'iphone-390' },
            { width: 320, height: 700, name: 'mobile-320' },
          ]

          for (const viewport of viewports) {
            const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height } })
            const runtimeErrors = []
            const consoleErrors = []
            page.on('pageerror', error => runtimeErrors.push(error.message))
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text())
            })

            await page.goto('http://127.0.0.1:4173/Movera-host1/', { waitUntil: 'domcontentloaded' })
            await page.getByTestId('page-home').waitFor()

            const categories = page.getByTestId('home-categories').locator('button')
            if (await categories.count() !== 7) throw new Error(`${viewport.name}: expected 7 categories`)

            const labels = await categories.allTextContents()
            const normalized = labels.map(v => v.trim())
            const wanted = expected.map(v => v.label)
            if (JSON.stringify(normalized) !== JSON.stringify(wanted)) {
              throw new Error(`${viewport.name}: category order mismatch: ${JSON.stringify(normalized)}`)
            }

            if (await categories.nth(0).getAttribute('data-active') !== 'true') {
              throw new Error(`${viewport.name}: Tout must be active initially`)
            }

            for (let index = 0; index < expected.length; index++) {
              const spec = expected[index]
              const button = categories.nth(index)
              await button.scrollIntoViewIfNeeded()
              await button.click()
              await page.waitForTimeout(120)

              for (let j = 0; j < expected.length; j++) {
                const state = await categories.nth(j).getAttribute('data-active')
                const shouldBeActive = j === index
                if ((state === 'true') !== shouldBeActive) {
                  throw new Error(`${viewport.name}: active-state failure after ${spec.label}, index ${j}`)
                }
              }

              const cards = page.getByTestId('home-featured').locator('.b225-featured-card')
              const cardCount = await cards.count()
              if (cardCount !== spec.count) {
                throw new Error(`${viewport.name}: ${spec.label} expected ${spec.count} cards, got ${cardCount}`)
              }

              const empty = page.getByTestId('home-featured').locator('.b225-empty')
              if (spec.count === 0) {
                if (await empty.count() !== 1) throw new Error(`${viewport.name}: ${spec.label} missing empty state`)
              } else if (await empty.count() !== 0) {
                throw new Error(`${viewport.name}: ${spec.label} unexpected empty state`)
              }

              const innerMotion = button.locator(':scope > span').first()
              if (await innerMotion.count() !== 1) throw new Error(`${viewport.name}: ${spec.label} missing isolated Motion wrapper`)
              const outerTransform = await button.evaluate(el => getComputedStyle(el).transform)
              const innerTransform = await innerMotion.evaluate(el => getComputedStyle(el).transform)
              if (outerTransform === 'none') throw new Error(`${viewport.name}: ${spec.label} lost existing CSS active transform`)
              if (innerTransform === 'none') throw new Error(`${viewport.name}: ${spec.label} Motion transform not running independently`)
            }

            const beach = categories.nth(2)
            await beach.scrollIntoViewIfNeeded()
            const beachInner = beach.locator(':scope > span').first()
            const box = await beachInner.boundingBox()
            if (!box) throw new Error(`${viewport.name}: unable to measure Plage Motion wrapper`)
            const before = await beachInner.evaluate(el => getComputedStyle(el).transform)
            await page.mouse.move(box.x + box.width / 2, box.y + box.height / 2)
            await page.mouse.down()
            await page.waitForTimeout(70)
            const during = await beachInner.evaluate(el => getComputedStyle(el).transform)
            await page.mouse.up()
            await page.waitForTimeout(220)
            const after = await beachInner.evaluate(el => getComputedStyle(el).transform)
            if (before === during) throw new Error(`${viewport.name}: Plage whileTap did not animate`)
            if (during === 'none') throw new Error(`${viewport.name}: Plage whileTap transform missing`)
            if (after === during) throw new Error(`${viewport.name}: Plage spring did not release`)

            const sequence = [0, 2, 1, 4, 3, 6, 5, 0, 4, 2, 0]
            for (const i of sequence) {
              await categories.nth(i).scrollIntoViewIfNeeded()
              await categories.nth(i).click()
            }
            await page.waitForTimeout(300)
            if (await categories.nth(0).getAttribute('data-active') !== 'true') {
              throw new Error(`${viewport.name}: rapid switching final state incorrect`)
            }
            if (await page.getByTestId('home-featured').locator('.b225-featured-card').count() !== 8) {
              throw new Error(`${viewport.name}: rapid switching final filter incorrect`)
            }

            const overflow = await page.evaluate(() => Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - window.innerWidth)
            if (overflow > 1) throw new Error(`${viewport.name}: page horizontal overflow ${overflow}px`)

            if (runtimeErrors.length) throw new Error(`${viewport.name}: runtime errors: ${runtimeErrors.join(' | ')}`)
            if (consoleErrors.length) throw new Error(`${viewport.name}: console errors: ${consoleErrors.join(' | ')}`)

            await page.close()
          }

          await browser.close()
          console.log('CATEGORY_E2E_PASS: 7 categories x 2 viewports, Motion isolation, filtering, stress switching, no runtime/console errors')
          EOF
          node category-e2e.mjs 2>&1 | tee -a category-motion-e2e-result.txt
          echo 'E2E=PASS' >> category-motion-e2e-result.txt

      - name: Stop preview
        if: always()
        run: |
          if [ -f /tmp/movera-category-preview.pid ]; then
            kill $(cat /tmp/movera-category-preview.pid) || true
          fi

      - name: Record CI result on test branch
        if: always()
        run: |
          touch category-motion-e2e-result.txt
          echo "JOB_STATUS=${{ job.status }}" >> category-motion-e2e-result.txt
          echo "TESTED_SHA=${{ github.sha }}" >> category-motion-e2e-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- category-motion-e2e-result.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test: record category Motion E2E result'
          git push origin HEAD:feat/category-motion
