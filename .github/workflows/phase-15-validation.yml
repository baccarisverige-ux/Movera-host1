name: Phase 15 Validation
on:
  push:
    branches: [phase15-error-offline-resilience]
  pull_request:
    branches: [phase14-host-app]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/movera-preview.log 2>&1 &
          echo $! > /tmp/movera-preview.pid
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:4173/resilience-lab >/dev/null && exit 0; sleep 1; done
          cat /tmp/movera-preview.log; exit 1
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Phase 15 resilience E2E gate
        run: |
          cat > phase15-smoke.mjs <<'EOF'
          import { chromium } from 'playwright'
          const browser=await chromium.launch({headless:true})
          const context=await browser.newContext({viewport:{width:390,height:844}})
          const page=await context.newPage()

          for (const state of ['loading','empty','success']) {
            await page.goto(`http://127.0.0.1:4173/resilience-lab?state=${state}`)
            await page.getByTestId(`state-${state}`).waitFor()
          }

          await page.goto('http://127.0.0.1:4173/resilience-lab?state=error')
          for (const kind of ['api','map']) {
            const card=page.getByTestId(`resilience-${kind}`)
            await card.getByRole('button',{name:'Réessayer'}).click(); await page.waitForTimeout(60)
            await card.getByRole('button',{name:'Réessayer'}).click(); await page.waitForTimeout(60)
            if ((await card.getAttribute('data-attempts')) !== '2') throw new Error(`${kind} retry count invalid`)
            if (!(await card.getByRole('button').isDisabled())) throw new Error(`${kind} retry not capped`)
          }

          await context.setOffline(true)
          await page.goto('http://127.0.0.1:4173/resilience-lab').catch(()=>{})
          await page.getByTestId('offline-fallback').waitFor()
          await context.setOffline(false)
          await page.reload()

          await page.goto('http://127.0.0.1:4173/listing/marsa-sea?mediaError=1')
          await page.getByTestId('listing-image-fallback').waitFor()
          await page.goto('http://127.0.0.1:4173/listing/missing')
          await page.getByTestId('page-listing-missing').waitFor()

          await page.goto('http://127.0.0.1:4173/booking/marsa-sea')
          await page.getByLabel('Scénario',{exact:true}).selectOption('unavailable')
          await page.getByTestId('booking-submit').click()
          if(!/plus disponibles/.test(await page.getByTestId('booking-error').innerText())) throw new Error('booking unavailable missing')
          await page.reload()
          await page.getByLabel('Scénario',{exact:true}).selectOption('session')
          await page.getByTestId('booking-submit').click()
          if(!/session/i.test(await page.getByTestId('booking-error').innerText())) throw new Error('session expired missing')

          await page.goto('http://127.0.0.1:4173/?__testError=1')
          await page.getByTestId('global-error-boundary').waitFor()
          await page.getByRole('button',{name:'Réessayer'}).click()
          await page.getByTestId('page-home').waitFor()

          await browser.close()
          EOF
          node phase15-smoke.mjs
      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/movera-preview.pid) || true
