name: Map Handoff Continuity E2E

on:
  push:
    branches: [b225-ui-home]
    paths:
      - src/features/search/searchState.js
      - src/features/map/MapPage.jsx
      - src/features/search/SearchTransitionHost.jsx
      - src/features/search/mapHandoff.js
      - .github/workflows/map-handoff-continuity-e2e.yml
  workflow_dispatch:

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/movera-map-handoff.log 2>&1 &
          echo $! > /tmp/movera-map-handoff.pid
          for i in {1..25}; do curl --fail --silent http://127.0.0.1:4173/Movera-host1/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/movera-map-handoff.log; exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Verify exact visual handoff
        run: |
          cat > /tmp/map-handoff-continuity.mjs <<'EOF'
          import { chromium } from 'playwright'

          const base = 'http://127.0.0.1:4173/Movera-host1/'

          async function run(label, contextOptions) {
            const browser = await chromium.launch({ headless: true })
            const context = await browser.newContext(contextOptions)
            const page = await context.newPage()
            const runtimeErrors = []
            page.on('pageerror', (error) => runtimeErrors.push(error.message))

            await page.goto(base, { waitUntil: 'networkidle' })
            await page.getByTestId('page-home').waitFor()
            await page.locator('.b225-search').first().click({ position: { x: 80, y: 25 } })

            const popup = page.getByTestId('search-transition')
            await popup.waitFor({ state: 'visible' })
            await page.waitForTimeout(1350)

            const input = page.locator('.movera-st__persistent-search input')
            await input.click()
            await input.fill('Marsa')
            const suggestions = page.locator('.movera-st__address-suggestion')
            await suggestions.first().waitFor({ state: 'visible', timeout: 2500 })
            await suggestions.first().click()
            await page.waitForTimeout(750)

            const days = page.locator('.movera-st__day:not([disabled]):not(.movera-st__day--empty)')
            await days.nth(0).click()
            await days.nth(2).click()
            await page.waitForTimeout(550)
            await page.getByRole('button', { name: /Continuer vers les voyageurs/ }).click()
            await page.waitForTimeout(650)

            const sourceSurface = page.locator('.movera-st__map-stage [data-testid="map-surface"]')
            const sourceViewport = await sourceSurface.evaluate((el) => ({
              lat: Number(el.dataset.lat),
              lng: Number(el.dataset.lng),
              zoom: Number(el.dataset.zoom),
            }))

            await page.evaluate(() => {
              window.__moveraRemovalState = null
              const visible = (element) => {
                if (!element) return false
                const style = getComputedStyle(element)
                const rect = element.getBoundingClientRect()
                return style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity) > 0.01 && rect.width > 0 && rect.height > 0
              }
              const observer = new MutationObserver(() => {
                if (document.querySelector('[data-testid="search-transition"]')) return
                if (window.__moveraRemovalState) return
                const mapPage = document.querySelector('[data-testid="page-map"]')
                const surface = mapPage?.querySelector('[data-testid="map-surface"]') || null
                const rect = surface?.getBoundingClientRect() || null
                const dataWidth = Number(surface?.dataset.width)
                const dataHeight = Number(surface?.dataset.height)
                const images = surface ? [...surface.querySelectorAll('.map-tile img')] : []
                const loaded = images.filter((image) => image.complete && image.naturalWidth > 0 && getComputedStyle(image).visibility !== 'hidden').length
                const stable = Boolean(rect)
                  && Number.isFinite(dataWidth)
                  && Number.isFinite(dataHeight)
                  && Math.abs(dataWidth - Math.round(rect.width)) <= 1
                  && Math.abs(dataHeight - Math.round(rect.height)) <= 1
                window.__moveraRemovalState = {
                  mapVisible: visible(mapPage),
                  stable,
                  loaded,
                  tileCount: images.length,
                }
                observer.disconnect()
              })
              observer.observe(document.body, { childList: true, subtree: true })
            })

            await page.getByRole('button', { name: /Rechercher sur la carte/ }).click()
            await page.waitForURL(/\/map(?:\?|$)/, { timeout: 1800 })
            const mapPage = page.getByTestId('page-map')
            await mapPage.waitFor({ state: 'visible', timeout: 2600 })

            const targetSurface = mapPage.getByTestId('map-surface')
            const targetViewport = await targetSurface.evaluate((el) => ({
              lat: Number(el.dataset.lat),
              lng: Number(el.dataset.lng),
              zoom: Number(el.dataset.zoom),
            }))

            const epsilon = 0.0000011
            if (Math.abs(sourceViewport.lat - targetViewport.lat) > epsilon) throw new Error(`${label}: latitude jumped ${sourceViewport.lat} -> ${targetViewport.lat}`)
            if (Math.abs(sourceViewport.lng - targetViewport.lng) > epsilon) throw new Error(`${label}: longitude jumped ${sourceViewport.lng} -> ${targetViewport.lng}`)
            if (Math.abs(sourceViewport.zoom - targetViewport.zoom) > 0.001) throw new Error(`${label}: zoom jumped ${sourceViewport.zoom} -> ${targetViewport.zoom}`)
            if (await mapPage.getAttribute('data-handoff-viewport') !== 'true') throw new Error(`${label}: exact handoff viewport missing`)

            await popup.waitFor({ state: 'detached', timeout: 3000 })
            await page.waitForTimeout(80)
            const removal = await page.evaluate(() => window.__moveraRemovalState)
            if (!removal?.mapVisible) throw new Error(`${label}: portal removed before MapPage was visible`)
            if (!removal?.stable) throw new Error(`${label}: portal removed before map size stabilized`)
            if (removal.tileCount > 0 && removal.loaded < Math.min(4, removal.tileCount)) throw new Error(`${label}: portal removed with only ${removal.loaded}/${removal.tileCount} tiles loaded`)
            if (runtimeErrors.length) throw new Error(`${label}: runtime errors: ${runtimeErrors.join('; ')}`)

            await browser.close()
          }

          await run('Desktop', { viewport: { width: 390, height: 844 } })
          await run('iPhone', {
            viewport: { width: 390, height: 844 },
            isMobile: true,
            hasTouch: true,
            deviceScaleFactor: 3,
            userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1',
          })
          console.log('PASS: exact viewport + stable painted Map handoff Desktop/iPhone')
          EOF
          node /tmp/map-handoff-continuity.mjs
      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/movera-map-handoff.pid) || true
