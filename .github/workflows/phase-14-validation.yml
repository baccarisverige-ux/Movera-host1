name: Phase 14 Validation
on:
  push:
    branches: [phase14-host-app]
  pull_request:
    branches: [phase13-core-account-messaging]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/movera-preview.log 2>&1 &
          echo $! > /tmp/movera-preview.pid
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:4173/host >/dev/null && exit 0; sleep 1; done
          cat /tmp/movera-preview.log; exit 1
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Phase 14 host E2E gate
        run: |
          cat > phase14-smoke.mjs <<'EOF'
          import { chromium } from 'playwright'
          const browser=await chromium.launch({headless:true})
          const page=await browser.newPage({viewport:{width:390,height:844}})
          const errors=[];page.on('pageerror',e=>errors.push(e.message))
          await page.goto('http://127.0.0.1:4173/host');await page.getByTestId('host-kpi-listings').waitFor();await page.getByTestId('host-upcoming').waitFor();await page.getByTestId('host-alerts').waitFor()
          await page.goto('http://127.0.0.1:4173/host/listings');await page.evaluate(()=>localStorage.removeItem('movera-host-listings-v1'));await page.reload();await page.getByTestId('host-create-link').click();await page.waitForURL(/\/host\/listings\/new$/)
          await page.getByRole('button',{name:'Enregistrer'}).click();await page.getByRole('alert').waitFor()
          await page.getByLabel('Titre').fill('Villa Test');await page.getByLabel('Prix par nuit').fill('300');await page.getByRole('button',{name:'Enregistrer'}).click();await page.waitForURL(/\/host\/listings$/);await page.getByText('Villa Test').waitFor()
          const row=page.getByText('Villa Test').locator('..').locator('..');await row.getByRole('button',{name:'Modifier'}).click();await page.getByLabel('Prix par nuit').fill('350');await page.getByRole('button',{name:'Enregistrer'}).click();await page.getByText('350 TND/nuit').waitFor()
          await page.getByText('Villa Test').locator('..').locator('..').getByRole('button',{name:'Archiver'}).click();await page.getByText(/archived/).last().waitFor()
          await page.goto('http://127.0.0.1:4173/host/reservations');for(const s of ['pending','confirmed','completed','cancelled'])await page.getByTestId(`reservation-${s}`).waitFor()
          await page.goto('http://127.0.0.1:4173/host/calendar');await page.getByLabel('Bloquer une date').fill('2026-09-01');if(!/2026-09-01/.test(await page.getByTestId('calendar-blocked').innerText()))throw new Error('Calendar block failed')
          await page.goto('http://127.0.0.1:4173/host/earnings');if(await page.getByTestId('earning-row').count()<2)throw new Error('Earnings rows missing')
          for(const width of [320,375,390,430,768,1024]){await page.setViewportSize({width,height:800});await page.goto('http://127.0.0.1:4173/host');const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1);if(overflow)throw new Error(`Host overflow ${width}`)}
          if(errors.length)throw new Error(errors.join(' | '));await browser.close()
          EOF
          node phase14-smoke.mjs
      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/movera-preview.pid) || true
