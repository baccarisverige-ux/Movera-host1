name: Finalize native Tunisia map button deployment

on:
  push:
    branches:
      - b225-ui-home
    paths:
      - .github/workflows/temp-home-map-deploy.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b225-ui-home
          fetch-depth: 0
      - name: Add stable E2E selector
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/home/HomePage.jsx')
          text = path.read_text()
          old = '<button type="button" className="b225-welcome__visual" aria-label="Explorer la carte de Tunisie" onClick={()=>onNavigate(\'/map\')}>'
          new = '<button type="button" className="b225-welcome__visual" data-testid="home-tunisia-map" aria-label="Explorer la carte de Tunisie" onClick={()=>onNavigate(\'/map\')}>'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one native Tunisia map button, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/temp-home-map-deploy.yml').unlink()
          PY
      - name: Commit final native button
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/home/HomePage.jsx .github/workflows/temp-home-map-deploy.yml
          git commit -m "fix(home): finalize native Tunisia map button"
          git push origin HEAD:b225-ui-home
