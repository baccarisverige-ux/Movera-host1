name: Deploy Search Premium Preview

on:
  push:
    branches: [search-ui-premium-polish]
  pull_request:
    branches: [phase-12-generalisation]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: search-premium-pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Search premium branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build production preview
        run: npm run build

      - name: Verify compiled output
        run: |
          test -f dist/index.html
          test -d dist/assets

      - name: Publish compiled dist to GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: deploy/github-pages
          folder: dist
          clean: true
          single-commit: true
