name: Deploy B225 Preview

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b225-pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout B225 UI branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production preview
        run: npm run build

      - name: Verify compiled output
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q '/Movera-host1/assets/' dist/index.html

      - name: Publish compiled dist to GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: deploy/github-pages
          folder: dist
          clean: true
          single-commit: true
