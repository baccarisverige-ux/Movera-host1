name: B225 Home Validation
on:
  push:
    branches: [b225-ui-home]
  pull_request:
    branches: [phase17-performance-engineering]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/movera-preview.log 2>&1 &
          echo $! > /tmp/movera-preview.pid
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:4173/Movera-host1/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/movera-preview.log; exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: B225 Home and guest nav gate
        run: |
          cat > b225-home-smoke.mjs <<'EOF'
          import { chromium } from 'playwright'
          const browser=await chromium.launch({headless:true})
          const page=await browser.newPage({viewport:{width:390,height:844}})
          const errors=[]
          page.on('pageerror',e=>errors.push(e.message))
          const base='http://127.0.0.1:4173/Movera-host1'

          await page.goto(`${base}/`,{waitUntil:'networkidle'})
          await page.getByTestId('page-home').waitFor()
          if(await page.locator('.b225-categories button').count()<7) throw new Error('B225 categories incomplete')
          for(const id of ['prestige','experience','partner']){
            const button=page.locator(`.b225-categories button[data-category-id="${id}"]`)
            if(await button.count()!==1) throw new Error(`category identity missing: ${id}`)
            const icon=button.locator('img[data-category-icon]')
            if(await icon.count()!==1) throw new Error(`real category icon missing: ${id}`)
            const state=await icon.evaluate(img=>({src:img.getAttribute('src'),naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,display:getComputedStyle(img).display,opacity:getComputedStyle(img).opacity}))
            if(!state.src||state.naturalWidth<1||state.naturalHeight<1||state.display==='none'||state.opacity==='0') throw new Error(`category icon not rendered: ${id} ${JSON.stringify(state)}`)
          }
          if(await page.locator('.b225-city').count()<10) throw new Error('B225 destinations incomplete')
          if(await page.getByTestId('home-services').locator('.b225-service-card').count()!==4) throw new Error('B225 services incomplete')
          if(await page.getByTestId('home-featured').locator('.b225-featured-card').count()<3) throw new Error('B225 featured incomplete')
          if(await page.getByTestId('home-map-cta').count()!==1) throw new Error('map CTA missing')
          const featuredMedia=await page.locator('.b225-featured-card .b225-card__image').first().boundingBox()
          if(!featuredMedia||featuredMedia.height<110) throw new Error('featured visual collapsed')
          const collectionMedia=await page.locator('.b225-section:not(.b225-featured-section) .b225-card__image').first().boundingBox()
          if(!collectionMedia) throw new Error('collection visual missing')
          if(Math.abs(collectionMedia.width-featuredMedia.width)>1||Math.abs(collectionMedia.height-featuredMedia.height)>1) throw new Error(`collection visual must match featured size: featured=${featuredMedia.width}x${featuredMedia.height}, collection=${collectionMedia.width}x${collectionMedia.height}`)
          const overflow=await page.evaluate(()=>Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-window.innerWidth)
          if(overflow>1) throw new Error(`critical horizontal overflow: ${overflow}`)
          const blanks=await page.locator('.b225-card__image').evaluateAll(nodes=>nodes.filter(n=>{const img=n.querySelector('img');return !img||!img.getAttribute('src')}).length)
          if(blanks) throw new Error(`blank property media slots: ${blanks}`)

          const assertNav=async(label,reference)=>{
            const nav=page.locator('.app-shell--guest > .app-shell__nav')
            await nav.waitFor({state:'visible'})
            await page.waitForTimeout(250)
            const box=await nav.boundingBox()
            if(!box) throw new Error(`nav missing on ${label}`)
            const items=nav.locator('.app-shell__nav-item')
            if(await items.count()!==5) throw new Error(`nav item count mismatch on ${label}`)
            const active=nav.locator('.app-shell__nav-item[data-active="true"]')
            if(await active.count()!==1) throw new Error(`active nav mismatch on ${label}`)
            const activeText=(await active.locator('span').textContent())?.trim()
            if(activeText!==label) throw new Error(`wrong active tab on ${label}: ${activeText}`)
            const activeStyle=await active.evaluate(el=>({color:getComputedStyle(el).color,label:getComputedStyle(el.querySelector('span')).color,svg:getComputedStyle(el.querySelector('svg')).stroke}))
            if(activeStyle.color!=='rgb(116, 198, 157)'||activeStyle.label!=='rgb(116, 198, 157)'||activeStyle.svg!=='rgb(116, 198, 157)') throw new Error(`active green missing on ${label}: ${JSON.stringify(activeStyle)}`)
            const itemBoxes=await items.evaluateAll(nodes=>nodes.map(n=>{const r=n.getBoundingClientRect();return {w:r.width,h:r.height}}))
            if(itemBoxes.some(b=>Math.abs(b.h-45)>0.5)) throw new Error(`item height mismatch on ${label}: ${JSON.stringify(itemBoxes)}`)
            const current={w:box.width,h:box.height,itemW:itemBoxes[0].w,itemH:itemBoxes[0].h}
            if(reference&&(Math.abs(current.w-reference.w)>0.5||Math.abs(current.h-reference.h)>0.5||Math.abs(current.itemW-reference.itemW)>0.5||Math.abs(current.itemH-reference.itemH)>0.5)) throw new Error(`nav geometry differs on ${label}: ref=${JSON.stringify(reference)} current=${JSON.stringify(current)}`)
            return current
          }

          let reference=await assertNav('Accueil',null)
          for(const label of ['Carte','Favoris']){
            const nav=page.locator('.app-shell--guest > .app-shell__nav')
            await nav.locator('.app-shell__nav-item',{hasText:label}).click()
            await page.waitForFunction(expected=>document.querySelector('.app-shell__nav-item[data-active="true"] span')?.textContent?.trim()===expected,label)
            await assertNav(label,reference)
          }

          for(const [label,target] of [['Messages','/messages'],['Profil','/profile']]){
            await page.goto(`${base}/`,{waitUntil:'networkidle'})
            const nav=page.locator('.app-shell--guest > .app-shell__nav')
            await nav.locator('.app-shell__nav-item',{hasText:label}).click()
            await page.waitForFunction(([expected,path])=>{
              const active=document.querySelector('.app-shell__nav-item[data-active="true"] span')?.textContent?.trim()
              const params=new URLSearchParams(location.search)
              return active===expected&&location.pathname.endsWith('/login')&&params.get('from')===path
            },[label,target])
            await assertNav(label,reference)
          }

          if(errors.length) throw new Error(`runtime errors: ${errors.join('; ')}`)
          await browser.close()
          EOF
          node b225-home-smoke.mjs
      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/movera-preview.pid) || true
