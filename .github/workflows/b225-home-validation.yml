name: B225 Home Validation
on:
  push:
    branches: [b225-ui-home]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/b225-home-validation.yml'
  pull_request:
    branches: [b225-ui-home]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/movera-preview.log 2>&1 &
          echo $! > /tmp/movera-preview.pid
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:4173/Movera-host1/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/movera-preview.log; exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: B225 Home and guest nav gate
        run: |
          cat > b225-home-smoke.mjs <<'EOF'
          import { chromium } from 'playwright'
          const browser=await chromium.launch({headless:true})
          const page=await browser.newPage({viewport:{width:390,height:844}})
          const errors=[]
          page.on('pageerror',e=>errors.push(e.message))
          const base='http://127.0.0.1:4173/Movera-host1'
          await page.goto(`${base}/`,{waitUntil:'networkidle'})
          await page.getByTestId('page-home').waitFor()
          if(await page.locator('.b225-categories button').count()<7) throw new Error('B225 categories incomplete')
          if(await page.locator('.b225-city').count()<10) throw new Error('B225 destinations incomplete')
          if(await page.getByTestId('home-services').locator('.b225-service-card').count()!==4) throw new Error('B225 services incomplete')
          if(await page.getByTestId('home-featured').locator('.b225-featured-card').count()<3) throw new Error('B225 featured incomplete')
          if(await page.getByTestId('home-map-cta').count()!==1) throw new Error('map CTA missing')
          const overflow=await page.evaluate(()=>Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-window.innerWidth)
          if(overflow>1) throw new Error(`critical horizontal overflow: ${overflow}`)
          const blanks=await page.locator('.b225-card__image').evaluateAll(nodes=>nodes.filter(n=>{const img=n.querySelector('img');return !img||!img.getAttribute('src')}).length)
          if(blanks) throw new Error(`blank property media slots: ${blanks}`)
          const nav=page.locator('.app-shell--guest > .app-shell__nav')
          await nav.waitFor({state:'visible'})
          if(await nav.locator('.app-shell__nav-item').count()!==5) throw new Error('guest nav item count mismatch')
          if(await nav.locator('.app-shell__nav-item[data-active="true"]').count()!==1) throw new Error('active nav mismatch')
          if(errors.length) throw new Error(`runtime errors: ${errors.join('; ')}`)
          await browser.close()
          EOF
          node b225-home-smoke.mjs
      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/movera-preview.pid) || true
