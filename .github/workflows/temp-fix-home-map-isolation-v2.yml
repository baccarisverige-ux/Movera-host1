name: One-shot Home Map isolation repair

on:
  push:
    branches: [b225-ui-home]
    paths: [.github/workflows/temp-fix-home-map-isolation-v2.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b225-ui-home
          fetch-depth: 0

      - name: Apply repair
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('src/features/home/HomePage.jsx')
          text = home.read_text()
          text = text.replace("import '../../styles/map-b225.css'\n", '', 1)
          anchor = "import '../../styles/home-b225-block3.css'\n"
          own = "import '../../styles/home-map-search-copy.css'\n"
          if own not in text:
              text = text.replace(anchor, anchor + own, 1)

          old = '<label className="b225-search b225-map-search" aria-label="Rechercher une destination"><SearchIcon/><span className="b225-map-search__copy"><strong>Explorez autrement</strong><span>Destination · Dates · Voyageurs</span></span><input data-testid="home-search" type="search" value={query} onChange={e=>setQuery(e.target.value)} aria-label="Destination"/><span className="b225-map-filter-button" aria-hidden="true">≡</span></label>'
          new = '<label className="b225-search b225-home-map-search" aria-label="Rechercher une destination"><SearchIcon/><span className="b225-home-map-search__copy"><strong>Explorez autrement</strong><span>Destination · Dates · Voyageurs</span></span><input data-testid="home-search" type="search" value={query} onChange={e=>setQuery(e.target.value)} aria-label="Destination"/><span className="b225-home-map-filter-button" aria-hidden="true">≡</span></label>'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'b225-home-map-search' not in text:
              raise SystemExit('Unexpected Home search markup')
          home.write_text(text)

          main = Path('src/main.jsx')
          main.write_text(main.read_text().replace("import './styles/home-map-search-copy.css'\n", '', 1))

          Path('src/styles/home-map-search-copy.css').write_text('''.b225-home .b225-search.b225-home-map-search{pointer-events:auto;height:52px;border:1px solid rgba(0,0,0,.06);border-radius:999px;background:rgba(255,255,255,.95);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);display:flex;align-items:center;gap:10px;padding:0 10px 0 17px;box-shadow:0 8px 26px rgba(25,28,26,.12);margin-inline:-4px;width:calc(100% + 8px);overflow:hidden}\n.b225-home .b225-search.b225-home-map-search:active{transform:none}\n.b225-home .b225-search.b225-home-map-search:focus-within{box-shadow:0 8px 26px rgba(25,28,26,.12)}\n.b225-home .b225-home-map-search>svg{width:18px;height:18px;fill:none;stroke:#202221;stroke-width:2;flex:none}\n.b225-home .b225-home-map-search__copy{min-width:0;display:grid;gap:1px;flex:1;pointer-events:none}\n.b225-home .b225-home-map-search__copy strong{font-size:13px;font-weight:760;letter-spacing:-.15px;color:#171817;line-height:normal}\n.b225-home .b225-home-map-search__copy span{font-size:10.5px;color:#747875;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:normal}\n.b225-home .b225-home-map-filter-button{width:38px;height:38px;flex:0 0 38px;border:1px solid #eceeed;border-radius:50%;background:#fff;display:grid;place-items:center;color:#232523;font-size:17px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.04);pointer-events:none}\n@media(max-width:350px){.b225-home .b225-search.b225-home-map-search{height:49px}}\n''')

          for p in [Path('.github/workflows/temp-fix-home-map-isolation.yml'), Path('.github/workflows/temp-fix-home-map-isolation-v2.yml')]:
              if p.exists(): p.unlink()
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(home): restore Map CSS and isolate search bar"
          git pull --rebase origin b225-ui-home
          git push origin HEAD:b225-ui-home
