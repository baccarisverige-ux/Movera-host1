name: Home CTA Source Cleanup Runner

on:
  push:
    branches: [b225-ui-home]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'ci(home): quality source cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove floating Home map CTA source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          home = Path('src/features/home/HomePage.jsx')
          s = home.read_text()
          s, n = re.subn(r'\n\s*<button className="b225-map-cta"[^\n]*?</button>', '', s, count=1)
          if n != 1:
              raise SystemExit(f'Home CTA markup removal count={n}')
          home.write_text(s)

          css = Path('src/styles/home-b225.css')
          s = css.read_text()
          s, n = re.subn(r'\.b225-map-cta\{[^}]*\}\.b225-map-cta svg\{[^}]*\}', '', s, count=1)
          if n != 1:
              raise SystemExit(f'CTA CSS removal count={n}')
          s, n = re.subn(r'(\.b225-home\{[^}]*?padding:)0 0 118px', r'\g<1>0 0 84px', s, count=1)
          if n != 1:
              raise SystemExit(f'Home bottom padding adjustment count={n}')
          css.write_text(s)
          PY
          ! grep -R "b225-map-cta\|home-map-cta" src

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Commit validated source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/home/HomePage.jsx src/styles/home-b225.css
          git commit -m "fix(home): remove floating map CTA"
          git pull --rebase origin b225-ui-home
          git push origin HEAD:b225-ui-home
