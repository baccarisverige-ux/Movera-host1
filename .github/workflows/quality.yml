name: Movera Quality Gate

on:
  push:
    branches: [b225-ui-home]
  pull_request:
    branches: [phase17-performance-engineering]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-quality:
    name: Lint · Unit · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install unit test runner
        run: npm install --no-save --package-lock=false vitest@3.2.4
      - run: npm run lint
      - name: Unit tests
        run: npx vitest run tests/unit
      - run: npm run build

  browser-quality:
    name: Mobile · E2E · A11y · Visual capture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser quality tools
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E and accessibility
        run: npx playwright test tests/e2e tests/accessibility --project=mobile-chromium --project=desktop-chromium
      - name: Capture visual references
        run: npx playwright test tests/visual --project=mobile-chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Lighthouse CI
        run: npm install --no-save --package-lock=false @lhci/cli@0.15.1
      - name: Run performance budgets
        run: npx lhci autorun --config=./lighthouserc.cjs
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lhci-report
          if-no-files-found: ignore
          retention-days: 14
