name: Apply exact Search dynamic fit correction

on:
  push:
    branches: [b225-ui-home]
    paths:
      - .github/workflows/apply-search-exact-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove legacy conflicts and wire isolated Motion height + autocomplete
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Search host: one autocomplete source + one Motion height controller.
          p = Path('src/features/search/SearchTransitionHost.jsx')
          s = p.read_text()

          anchor = "import { useSearchPanelFit } from './useSearchPanelFit.js'"
          imports = "import { useAddressAutocomplete } from './useAddressAutocomplete.js'\nimport { useSearchPanelFit } from './useSearchPanelFit.js'\nimport { useSearchPanelHeightMotion } from './useSearchPanelHeightMotion.js'"
          if "useAddressAutocomplete" not in s:
              s = s.replace(anchor, imports)

          pattern = re.compile(r"  const filteredAddressSuggestions = useMemo\(\(\) => \{.*?\n  \}, \[destinationQuery\]\)\n  const \{ contentRef, panelHeight: fittedPanelHeight \} = useSearchPanelFit\(\{ active, step, addressMode, lockedViewportHeight \}\)", re.S)
          replacement = "  const { suggestions: addressSuggestions, loading: addressLoading } = useAddressAutocomplete(destinationQuery, addressMode)\n  const { contentRef, panelHeight: fittedPanelHeight } = useSearchPanelFit({ active, step, addressMode, lockedViewportHeight })\n  const fallbackPanelHeight = Math.min(570, Math.max(455, Math.round(lockedViewportHeight * 0.64)))\n  const animatedPanelHeight = useSearchPanelHeightMotion({\n    active,\n    open,\n    ready,\n    targetHeight: fittedPanelHeight,\n    fallbackHeight: fallbackPanelHeight,\n  })"
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Address/fitting block replacement count={count}')

          old = "  if (!active) return null\n\n  const fallbackPanelHeight = Math.min(570, Math.max(455, Math.round(lockedViewportHeight * 0.64)))\n  const panelHeight = fittedPanelHeight || fallbackPanelHeight"
          new = "  if (!active) return null\n\n  const panelHeight = animatedPanelHeight"
          if old not in s:
              raise SystemExit('Panel height block not found')
          s = s.replace(old, new, 1)

          s = s.replace('filteredAddressSuggestions', 'addressSuggestions')
          label = "              <span className=\"movera-st__address-label\">{destinationQuery.trim() ? 'Adresses suggérées' : 'Adresses populaires'}</span>"
          loading = label + "\n              {addressLoading ? <div className=\"movera-st__address-loading\" role=\"status\">Recherche d’adresses…</div> : null}"
          if 'movera-st__address-loading' not in s:
              if label not in s:
                  raise SystemExit('Address label marker not found')
              s = s.replace(label, loading, 1)

          s = s.replace('id="movera-address-suggestions">', 'id="movera-address-suggestions" aria-busy={addressLoading ? \'true\' : \'false\'}>', 1)
          p.write_text(s)

          # 2) Delete legacy fixed-height/focus rules. Dynamic measured height is the only authority.
          p = Path('src/features/search/searchTransition-stability.css')
          s = p.read_text()
          s, focus_count = re.subn(r'\.movera-st__panel:has\(\.movera-st__destination-search input:focus\)[^{]*\{[^}]*\}', '', s)
          s, height_count = re.subn(r'\.movera-st\[data-step="(?:destination|dates|guests)"\]\{--st-panel-height:[^}]*\}', '', s)
          s = s.replace('.movera-st--open .movera-st__panel{height:var(--st-panel-height)!important}', '')
          if focus_count < 2:
              raise SystemExit(f'Expected legacy focus rules, removed {focus_count}')
          if height_count < 3:
              raise SystemExit(f'Expected fixed step heights, removed {height_count}')
          p.write_text(s)

          # 3) Motion is the only step animation; remove the old CSS screen animation property.
          p = Path('src/features/search/searchTransition.css')
          s = p.read_text()
          s, animation_count = re.subn(r'animation:moveraStScreen[^;}]*;?', '', s)
          if animation_count < 1:
              raise SystemExit('Legacy screen animation property not found')
          p.write_text(s)

          # 4) Address loading material, scoped only to address mode.
          p = Path('src/features/search/searchAddressMode.css')
          s = p.read_text()
          if '.movera-st__address-loading' not in s:
              s += "\n.movera-st__address-loading{margin:0 0 7px 3px;color:#7e8781;font-size:8.2px;font-weight:650;letter-spacing:.01em;animation:moveraAddressPulse 1s ease-in-out infinite}\n@keyframes moveraAddressPulse{0%,100%{opacity:.45}50%{opacity:1}}\n@media(prefers-reduced-motion:reduce){.movera-st__address-loading{animation:none}}\n"
          p.write_text(s)

          # 5) Repair the targeted CI close timing and teach it the new dynamic workflow.
          p = Path('.github/workflows/search-motion-targeted-e2e.yml')
          s = p.read_text()
          s = s.replace('await page.waitForTimeout(1050)', 'await page.waitForTimeout(1350)', 1)

          old_focus = """            await input.click()\n            if(!await input.evaluate(el=>document.activeElement===el)) throw new Error(`${label}: intentional input focus failed`)\n            await input.blur()\n            await page.waitForTimeout(500)\n"""
          new_focus = """            const destinationLast=page.locator('.movera-st__destination').last()\n            const destinationLastBox=await destinationLast.boundingBox()\n            const destinationPanelBox=await panel.boundingBox()\n            if(!destinationLastBox||!destinationPanelBox) throw new Error(`${label}: destination fit elements missing`)\n            const destinationGap=(destinationPanelBox.y+destinationPanelBox.height)-(destinationLastBox.y+destinationLastBox.height)\n            if(destinationGap>42) throw new Error(`${label}: destination panel has excess bottom gap ${destinationGap}`)\n\n            const beforeAddressBox=await panel.boundingBox()\n            await input.click()\n            if(!await input.evaluate(el=>document.activeElement===el)) throw new Error(`${label}: intentional input focus failed`)\n            await page.waitForTimeout(500)\n            if(await popup.getAttribute('data-address-mode')!=='true') throw new Error(`${label}: address mode did not activate`)\n            const addressBox=await panel.boundingBox()\n            if(!beforeAddressBox||!addressBox||addressBox.height>=beforeAddressBox.height-20) throw new Error(`${label}: address mode did not compact panel`)\n            await input.fill('Marsa')\n            const suggestions=page.locator('.movera-st__address-suggestion')\n            await suggestions.first().waitFor({state:'visible',timeout:2500})\n            const lastSuggestionBox=await suggestions.last().boundingBox()\n            const shortPanelBox=await panel.boundingBox()\n            if(!lastSuggestionBox||!shortPanelBox) throw new Error(`${label}: address suggestion fit missing`)\n            const addressGap=(shortPanelBox.y+shortPanelBox.height)-(lastSuggestionBox.y+lastSuggestionBox.height)\n            if(addressGap>34) throw new Error(`${label}: address panel has excess bottom gap ${addressGap}`)\n            await suggestions.first().click()\n            await page.waitForTimeout(700)\n            if(await popup.getAttribute('data-step')!=='dates') throw new Error(`${label}: address selection did not advance to dates`)\n\n            const days=page.locator('.movera-st__day:not([disabled]):not(.movera-st__day--empty)')\n            if(await days.count()<3) throw new Error(`${label}: not enough selectable calendar days`)\n            await days.nth(0).click()\n            await days.nth(2).click()\n            await page.waitForTimeout(550)\n            const continueButton=page.getByRole('button',{name:/Continuer vers les voyageurs/})\n            if(await continueButton.isDisabled()) throw new Error(`${label}: calendar continue button stayed disabled`)\n            const datesBox=await panel.boundingBox()\n            const continueBox=await continueButton.boundingBox()\n            if(!datesBox||!continueBox) throw new Error(`${label}: dates fit elements missing`)\n            const datesGap=(datesBox.y+datesBox.height)-(continueBox.y+continueBox.height)\n            if(datesGap>34) throw new Error(`${label}: dates panel has excess bottom gap ${datesGap}`)\n            await continueButton.click()\n            await page.waitForTimeout(650)\n            if(await popup.getAttribute('data-step')!=='guests') throw new Error(`${label}: dates did not advance to guests`)\n            const searchButton=page.getByRole('button',{name:/Rechercher sur la carte/})\n            const guestsBox=await panel.boundingBox()\n            const searchBox=await searchButton.boundingBox()\n            if(!guestsBox||!searchBox) throw new Error(`${label}: guests fit elements missing`)\n            const guestsGap=(guestsBox.y+guestsBox.height)-(searchBox.y+searchBox.height)\n            if(guestsGap>34) throw new Error(`${label}: guests panel has excess bottom gap ${guestsGap}`)\n"""
          if old_focus not in s:
              raise SystemExit('Targeted E2E focus block not found')
          s = s.replace(old_focus, new_focus, 1)

          old_close = """            await page.waitForTimeout(650)\n            if(await popup.count()!==1) throw new Error(`${label}: popup detached before final handoff window`)\n            const lateOpacity=Number(await panel.evaluate(el=>getComputedStyle(el).opacity))\n            if(lateOpacity>0.95) throw new Error(`${label}: final Home handoff did not start near close end`)\n            await popup.waitFor({state:'detached',timeout:1200})\n"""
          new_close = """            await page.waitForTimeout(180)\n            if(await popup.count()!==1) throw new Error(`${label}: popup detached before configured close duration`)\n            await page.waitForTimeout(260)\n            await popup.waitFor({state:'detached',timeout:900})\n"""
          if old_close not in s:
              raise SystemExit('Targeted E2E late close block not found')
          s = s.replace(old_close, new_close, 1)
          p.write_text(s)
          PY

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/movera-exact-search.log 2>&1 &
          echo $! > /tmp/movera-exact-search.pid
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4173/Movera-host1/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/movera-exact-search.log
          exit 1

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Exact Search UAT desktop + iPhone
        run: |
          cat > /tmp/search-exact.mjs <<'EOF'
          import { chromium } from 'playwright'
          const base='http://127.0.0.1:4173/Movera-host1/'
          async function run(label, options){
            const browser=await chromium.launch({headless:true})
            const context=await browser.newContext(options)
            const page=await context.newPage()
            const errors=[]
            page.on('pageerror',e=>errors.push(e.message))
            await page.goto(base,{waitUntil:'networkidle'})
            await page.getByTestId('page-home').waitFor()
            await page.locator('.b225-search').first().click({position:{x:90,y:25}})
            const popup=page.getByTestId('search-transition')
            const panel=page.locator('.movera-st__panel')
            const input=page.locator('.movera-st__persistent-search input')
            await popup.waitFor({state:'visible'})
            await page.waitForTimeout(1400)

            const lastDestination=page.locator('.movera-st__destination').last()
            const db=await lastDestination.boundingBox(); const pb=await panel.boundingBox()
            if(!db||!pb) throw new Error(`${label}: destination fit missing`)
            if((pb.y+pb.height)-(db.y+db.height)>42) throw new Error(`${label}: destination excess gap`)

            const fullHeight=pb.height
            await input.click(); await page.waitForTimeout(500)
            if(await popup.getAttribute('data-address-mode')!=='true') throw new Error(`${label}: address mode inactive`)
            const compact=await panel.boundingBox()
            if(!compact||compact.height>=fullHeight-20) throw new Error(`${label}: address panel not compact`)
            await input.fill('Marsa')
            const suggestions=page.locator('.movera-st__address-suggestion')
            await suggestions.first().waitFor({state:'visible',timeout:2500})
            const sb=await suggestions.last().boundingBox(); const apb=await panel.boundingBox()
            if(!sb||!apb||(apb.y+apb.height)-(sb.y+sb.height)>34) throw new Error(`${label}: address exact fit failed`)
            await suggestions.first().click(); await page.waitForTimeout(700)
            if(await popup.getAttribute('data-step')!=='dates') throw new Error(`${label}: address -> dates failed`)

            const days=page.locator('.movera-st__day:not([disabled]):not(.movera-st__day--empty)')
            if(await days.count()<3) throw new Error(`${label}: insufficient selectable days`)
            await days.nth(0).click(); await days.nth(2).click(); await page.waitForTimeout(550)
            const next=page.getByRole('button',{name:/Continuer vers les voyageurs/})
            if(await next.isDisabled()) throw new Error(`${label}: continue disabled after valid range`)
            const nb=await next.boundingBox(); const dpb=await panel.boundingBox()
            if(!nb||!dpb||(dpb.y+dpb.height)-(nb.y+nb.height)>34) throw new Error(`${label}: dates exact fit failed`)
            await next.click(); await page.waitForTimeout(650)
            const final=page.getByRole('button',{name:/Rechercher sur la carte/})
            const fb=await final.boundingBox(); const gpb=await panel.boundingBox()
            if(!fb||!gpb||(gpb.y+gpb.height)-(fb.y+fb.height)>34) throw new Error(`${label}: guests exact fit failed`)
            if(errors.length) throw new Error(`${label}: runtime ${errors.join('; ')}`)
            await browser.close()
          }
          await run('Desktop',{viewport:{width:390,height:844}})
          await run('iPhone',{viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:3,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'})
          console.log('PASS exact dynamic Search UAT')
          EOF
          node /tmp/search-exact.mjs

      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/movera-exact-search.pid) || true

      - name: Persist validated correction
        run: |
          rm .github/workflows/apply-search-exact-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/search/SearchTransitionHost.jsx src/features/search/searchTransition-stability.css src/features/search/searchTransition.css src/features/search/searchAddressMode.css .github/workflows/search-motion-targeted-e2e.yml .github/workflows/apply-search-exact-fix.yml
          git commit -m "fix(search): exact content fit and address mode [skip ci]"
          git pull --rebase origin b225-ui-home
          git push
