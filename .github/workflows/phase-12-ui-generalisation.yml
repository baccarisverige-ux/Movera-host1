name: Phase 12 UI Generalisation

on:
  push:
    branches: [phase-12-generalisation]
  pull_request:
  workflow_dispatch:

jobs:
  ui-generalisation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - name: Validate shared UI architecture
        run: npm run test:architecture:ui
