name: Phase 10 Validation
on:
  push:
    branches: [phase10-map-carousel-integration]
  pull_request:
    branches: [phase9-gesture-arbitration]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/movera-preview.log 2>&1 &
          echo $! > /tmp/movera-preview.pid
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:4173/map >/dev/null && exit 0; sleep 1; done
          cat /tmp/movera-preview.log; exit 1
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Integrated map carousel back-state E2E gate
        run: |
          cat > phase10-smoke.mjs <<'EOF'
          import { chromium } from 'playwright'
          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } })
          const errors = []
          page.on('pageerror', e => errors.push(e.message))
          await page.goto('http://127.0.0.1:4173/map')
          const map = page.getByTestId('map-engine')
          const surface = page.getByTestId('map-surface')
          await surface.waitFor()
          if ((await page.getByTestId('page-map').getAttribute('data-official-flow')) !== 'marker-carousel-detail') throw new Error('Official map flow missing')
          const marker = page.locator('button[data-testid^="map-marker-"]').first()
          await marker.waitFor()
          await marker.click({ force: true })
          await page.waitForTimeout(150)
          const firstSelected = await map.getAttribute('data-selected-listing-id')
          if (!firstSelected) throw new Error('Marker did not set selectedListingId')
          if ((await page.getByTestId('carousel-shell').getAttribute('data-selected-listing-id')) !== firstSelected) throw new Error('Carousel not synchronized from marker')
          if ((await page.getByTestId('carousel-shell').getAttribute('data-carousel-state')) === 'closed') throw new Error('Carousel did not open from marker selection')
          await page.getByRole('button', { name: 'Offre suivante' }).click()
          await page.waitForTimeout(150)
          const secondSelected = await page.getByTestId('carousel-shell').getAttribute('data-selected-listing-id')
          if (!secondSelected || secondSelected === firstSelected) throw new Error('Carousel next did not change listing')
          if ((await map.getAttribute('data-selected-listing-id')) !== secondSelected) throw new Error('Map marker state not synchronized from carousel')
          await surface.evaluate(el => {
            const fire=(t,x,y)=>el.dispatchEvent(new PointerEvent(t,{bubbles:true,cancelable:true,pointerId:91,pointerType:'touch',clientX:x,clientY:y,isPrimary:true}))
            fire('pointerdown',120,260); fire('pointermove',170,285); fire('pointerup',170,285)
          })
          await page.waitForTimeout(120)
          const beforeDetail = await surface.evaluate(el => ({lat:el.dataset.lat,lng:el.dataset.lng,zoom:el.dataset.zoom}))
          await page.getByRole('button', { name: 'Voir le détail' }).click()
          await page.waitForURL(/\/listing\//)
          if ((await page.getByTestId('page-listing').getAttribute('data-listing-id')) !== secondSelected) throw new Error('Detail route listing mismatch')
          await page.getByTestId('detail-back-map').click()
          await page.waitForURL(/\/map$/)
          await page.waitForTimeout(150)
          const restored = await page.getByTestId('map-surface').evaluate(el => ({lat:el.dataset.lat,lng:el.dataset.lng,zoom:el.dataset.zoom}))
          if (JSON.stringify(restored) !== JSON.stringify(beforeDetail)) throw new Error(`Back viewport mismatch ${JSON.stringify({beforeDetail,restored})}`)
          if ((await page.getByTestId('map-engine').getAttribute('data-selected-listing-id')) !== secondSelected) throw new Error('Back selected listing mismatch')
          if ((await page.getByTestId('carousel-shell').getAttribute('data-carousel-state')) === 'closed') throw new Error('Back carousel state not restored')
          const path = await page.evaluate(() => location.pathname)
          if (path !== '/map') throw new Error(`Parallel path detected: ${path}`)
          if (errors.length) throw new Error(errors.join(' | '))
          await browser.close()
          EOF
          node phase10-smoke.mjs
      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/movera-preview.pid) || true
