name: Phase 6 Validation

on:
  push:
    branches:
      - refactor/movera-architecture-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/movera-preview.log 2>&1 &
          echo $! > /tmp/movera-preview.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/map > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/movera-preview.log
          exit 1
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Map stability viewport gestures lifecycle and performance
        run: |
          cat > phase6-smoke.mjs <<'EOF'
          import { chromium } from 'playwright'
          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } })
          const crashes = []
          page.on('pageerror', error => crashes.push(error.message))
          await page.goto('http://127.0.0.1:4173/map', { waitUntil: 'domcontentloaded' })
          const surface = page.locator('[data-testid="map-surface"]')
          await surface.waitFor()
          await page.waitForTimeout(300)

          if (await page.locator('[data-testid*="carousel"]').count()) throw new Error('Map must be stable without carousel in Phase 6')
          const initial = await surface.evaluate(el => ({ lat: el.dataset.lat, lng: el.dataset.lng, zoom: Number(el.dataset.zoom) }))
          const tileCount = Number(await page.locator('[data-testid="map-tile-layer"]').getAttribute('data-tile-count'))
          if (tileCount < 4 || tileCount > 80) throw new Error(`Unexpected tile count ${tileCount}`)

          const box = await surface.boundingBox()
          if (!box || box.width < 250 || box.height < 350) throw new Error('Map viewport invalid')
          const coverage = await page.evaluate(() => {
            const surfaceEl = document.querySelector('[data-testid="map-surface"]')
            const tiles = [...document.querySelectorAll('.map-tile')].map(el => el.getBoundingClientRect())
            const r = surfaceEl.getBoundingClientRect()
            const points = [[r.left + 2, r.top + 2], [r.right - 2, r.top + 2], [r.left + 2, r.bottom - 2], [r.right - 2, r.bottom - 2], [r.left + r.width / 2, r.top + r.height / 2]]
            return points.every(([x, y]) => tiles.some(tile => x >= tile.left && x <= tile.right && y >= tile.top && y <= tile.bottom))
          })
          if (!coverage) throw new Error('Tile layer does not cover viewport')

          await surface.evaluate((el) => {
            const fire = (type, id, x, y, pointerType = 'mouse') => el.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, pointerId: id, pointerType, clientX: x, clientY: y, isPrimary: true }))
            fire('pointerdown', 1, 150, 280)
            fire('pointermove', 1, 175, 292)
            fire('pointermove', 1, 210, 310)
            fire('pointermove', 1, 245, 322)
            fire('pointerup', 1, 245, 322)
          })
          await page.waitForTimeout(100)
          const afterPan = await surface.evaluate(el => ({ lat: el.dataset.lat, lng: el.dataset.lng }))
          if (afterPan.lat === initial.lat && afterPan.lng === initial.lng) throw new Error('Pan did not update viewport')

          const zoomBeforeButton = Number(await surface.getAttribute('data-zoom'))
          await page.getByRole('button', { name: 'Zoom avant' }).click()
          await page.waitForTimeout(80)
          const zoomAfterButton = Number(await surface.getAttribute('data-zoom'))
          if (zoomAfterButton <= zoomBeforeButton) throw new Error('Zoom + failed')
          await page.getByRole('button', { name: 'Zoom arrière' }).click()
          await page.waitForTimeout(80)

          const zoomBeforeDouble = Number(await surface.getAttribute('data-zoom'))
          await surface.dblclick({ position: { x: box.width / 2, y: box.height / 2 } })
          await page.waitForTimeout(80)
          if (Number(await surface.getAttribute('data-zoom')) <= zoomBeforeDouble) throw new Error('Double-click zoom failed')

          const zoomBeforeWheel = Number(await surface.getAttribute('data-zoom'))
          await page.mouse.move(box.x + box.width / 2, box.y + box.height / 2)
          await page.mouse.wheel(0, 180)
          await page.waitForTimeout(80)
          if (Number(await surface.getAttribute('data-zoom')) >= zoomBeforeWheel) throw new Error('Wheel zoom failed')

          const zoomBeforePinch = Number(await surface.getAttribute('data-zoom'))
          await surface.evaluate((el) => {
            const fire = (type, id, x, y) => el.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, pointerId: id, pointerType: 'touch', clientX: x, clientY: y, isPrimary: id === 11 }))
            fire('pointerdown', 11, 130, 300)
            fire('pointerdown', 12, 210, 300)
            fire('pointermove', 12, 255, 300)
            fire('pointerup', 11, 130, 300)
            fire('pointerup', 12, 255, 300)
          })
          await page.waitForTimeout(100)
          if (Number(await surface.getAttribute('data-zoom')) <= zoomBeforePinch) throw new Error('Pinch zoom failed')

          for (const viewport of [{ width: 320, height: 700 }, { width: 1024, height: 900 }, { width: 430, height: 820 }, { width: 390, height: 844 }]) {
            await page.setViewportSize(viewport)
            await page.waitForTimeout(80)
            const metrics = await surface.evaluate(el => ({ width: Number(el.dataset.width), height: Number(el.dataset.height), scrollWidth: el.scrollWidth, clientWidth: el.clientWidth }))
            if (metrics.width < 250 || metrics.height < 350) throw new Error(`Resize invalid at ${viewport.width}`)
            if (metrics.scrollWidth > metrics.clientWidth + 1) throw new Error(`Map overflow at ${viewport.width}`)
          }

          const lifecycleBefore = Number(await surface.getAttribute('data-lifecycle-events'))
          await page.evaluate(() => {
            document.dispatchEvent(new Event('visibilitychange'))
            window.dispatchEvent(new Event('orientationchange'))
          })
          await page.waitForTimeout(80)
          const lifecycleAfter = Number(await surface.getAttribute('data-lifecycle-events'))
          if (lifecycleAfter < lifecycleBefore + 2) throw new Error('Viewport lifecycle handlers failed')

          await surface.evaluate((el) => {
            const fire = (type, id, x, y) => el.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, pointerId: id, pointerType: 'mouse', clientX: x, clientY: y, isPrimary: true }))
            fire('pointerdown', 21, 80, 180)
            for (let i = 0; i < 40; i += 1) fire('pointermove', 21, 80 + i * 4, 180 + (i % 5) * 2)
            fire('pointerup', 21, 236, 188)
          })
          await page.waitForTimeout(120)
          const perf = await surface.evaluate(el => ({ updates: Number(el.dataset.updateCount), renders: Number(el.dataset.renderCount), listeners: Number(el.dataset.listenerCount) }))
          if (perf.updates > 140 || perf.renders > 220 || perf.listeners > 10) throw new Error(`Performance budget exceeded ${JSON.stringify(perf)}`)
          if (crashes.length) throw new Error(`Map crashes: ${crashes.join(' | ')}`)

          await page.screenshot({ path: '/tmp/phase6-map.png', fullPage: true })
          await browser.close()
          EOF
          node phase6-smoke.mjs
      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/movera-preview.pid) || true
