name: Phase 5 Validation

on:
  push:
    branches:
      - refactor/movera-architecture-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/movera-preview.log 2>&1 &
          echo $! > /tmp/movera-preview.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/movera-preview.log
          exit 1
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Home functional responsive console navigation visual smoke
        run: |
          cat > phase5-smoke.mjs <<'EOF'
          import { chromium } from 'playwright'
          const browser = await chromium.launch({ headless: true })
          const widths = [320, 375, 390, 393, 430, 768, 1024]
          for (const width of widths) {
            const page = await browser.newPage({ viewport: { width, height: 900 } })
            const errors = []
            page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()) })
            page.on('pageerror', error => errors.push(error.message))
            const response = await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })
            if (!response?.ok()) throw new Error(`Home HTTP failure at ${width}`)
            await page.locator('[data-testid="page-home"]').waitFor()
            await page.locator('[data-testid="home-categories"]').waitFor()
            await page.locator('[data-testid="home-featured"]').waitFor()
            await page.locator('[data-testid="home-favorites"]').waitFor()
            await page.locator('[data-testid="home-destinations"]').waitFor()
            await page.locator('[data-testid="home-map-cta"]').waitFor()
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 1)
            if (overflow) throw new Error(`Horizontal overflow at ${width}px`)
            await page.screenshot({ path: `/tmp/home-${width}.png`, fullPage: true })
            if (errors.length) throw new Error(`Console/page errors at ${width}: ${errors.join(' | ')}`)
            await page.close()
          }

          const page = await browser.newPage({ viewport: { width: 390, height: 844 } })
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })
          await page.getByRole('button', { name: 'Plage' }).click()
          await page.locator('[data-testid="home-card-marsa-sea"]').waitFor()
          if (await page.locator('[data-testid="home-card-dar-carthage"]').count()) throw new Error('Category filter did not filter')
          await page.locator('[data-testid="home-search"]').fill('Marsa')
          await page.locator('[data-testid="home-card-marsa-sea"]').waitFor()
          await page.getByRole('button', { name: 'Explorer la carte', exact: true }).click()
          await page.locator('[data-testid="page-map"]').waitFor()
          if (new URL(page.url()).pathname !== '/map') throw new Error('Map CTA navigation failed')
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })
          await page.getByRole('button', { name: 'Voir l’offre' }).first().click()
          await page.locator('[data-testid="page-listing"]').waitFor()
          if (!new URL(page.url()).pathname.startsWith('/listing/')) throw new Error('Listing navigation failed')
          await browser.close()
          EOF
          node phase5-smoke.mjs
      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/movera-preview.pid) || true
