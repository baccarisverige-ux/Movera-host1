name: Search Transition Validation
on:
  push:
    branches: [b225-ui-home]
  pull_request:
    branches: [phase17-performance-engineering]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/movera-search-preview.log 2>&1 &
          echo $! > /tmp/movera-search-preview.pid
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:4173/Movera-host1/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/movera-search-preview.log; exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Search transition E2E
        run: |
          cat > search-transition-smoke.mjs <<'EOF'
          import { chromium } from 'playwright'
          const browser=await chromium.launch({headless:true})
          const page=await browser.newPage({viewport:{width:390,height:844}})
          const errors=[]
          page.on('pageerror',error=>errors.push(error.message))
          const base='http://127.0.0.1:4173/Movera-host1'

          await page.goto(`${base}/`,{waitUntil:'networkidle'})
          await page.getByTestId('page-home').waitFor()
          const scrollBefore=await page.evaluate(()=>window.scrollY)
          await page.locator('.b225-search').click({position:{x:80,y:25}})
          const transition=page.getByTestId('search-transition')
          await transition.waitFor({state:'visible'})
          await page.waitForTimeout(1050)

          const panel=page.locator('.movera-st__panel')
          const panelBox=await panel.boundingBox()
          if(!panelBox) throw new Error('Expanded search panel missing')
          const ratio=panelBox.height/844
          if(ratio<0.58||ratio>0.63) throw new Error(`Search panel is not approximately 60% viewport: ${ratio}`)
          const contentOpacity=await page.locator('.movera-st__content').evaluate(el=>getComputedStyle(el).opacity)
          if(Number(contentOpacity)<0.99) throw new Error(`Popup content did not settle fully: opacity ${contentOpacity}`)
          if(await page.getByTestId('map-engine').count()<1) throw new Error('Map not visible below expanded search')
          const mapFilter=await page.locator('.movera-st__map-stage').evaluate(el=>getComputedStyle(el).filter)
          if(!mapFilter.includes('blur')) throw new Error(`Map blur missing during search: ${mapFilter}`)
          const mapPointerEvents=await page.locator('.movera-st__map-stage').evaluate(el=>getComputedStyle(el).pointerEvents)
          if(mapPointerEvents!=='none') throw new Error(`Map must not pan/scroll on search screen: ${mapPointerEvents}`)
          const bodyPosition=await page.evaluate(()=>getComputedStyle(document.body).position)
          if(bodyPosition!=='fixed') throw new Error(`Body not locked on iOS-style search state: ${bodyPosition}`)
          const bodyOverflow=await page.evaluate(()=>getComputedStyle(document.body).overflow)
          if(bodyOverflow!=='hidden') throw new Error(`Body overflow not locked: ${bodyOverflow}`)
          const internalOverflows=await page.locator('.movera-st__body,.movera-st__screen,.movera-st__destinations,.movera-st__recents').evaluateAll(nodes=>nodes.map(el=>getComputedStyle(el).overflowY))
          if(internalOverflows.some(value=>value==='auto'||value==='scroll')) throw new Error(`Internal scrolling still enabled: ${internalOverflows.join(',')}`)
          await page.mouse.wheel(0,700)
          await page.waitForTimeout(80)
          const scrollAfter=await page.evaluate(()=>window.scrollY)
          if(scrollAfter!==scrollBefore) throw new Error(`Search screen scrolled: ${scrollBefore} -> ${scrollAfter}`)
          if(await page.getByText('Recherches récentes').count()!==1) throw new Error('Recent searches section missing')
          if(await page.getByText('Destinations suggérées').count()!==1) throw new Error('Suggested destinations section missing')

          await page.locator('[data-destination="la-marsa"]').click()
          await page.getByTestId('search-step-dates').waitFor()
          await page.getByTestId('search-calendar').waitFor()
          if(await page.locator('.movera-st__calendar-grid .movera-st__day').count()<28) throw new Error('Full calendar grid missing')
          await page.getByRole('button',{name:'Mois suivant'}).click()
          await page.locator('[data-date="2026-09-10"]').click()
          await page.locator('[data-date="2026-09-14"]').click()
          await page.getByTestId('search-step-dates').locator('.movera-st__action').click()
          await page.getByTestId('search-step-guests').waitFor()
          for(const label of ['Adultes','Enfants','Bébés','Animaux']){if(await page.getByText(label,{exact:true}).count()<1) throw new Error(`${label} row missing`)}
          await page.getByRole('button',{name:'Ajouter adultes'}).click()
          await page.getByRole('button',{name:'Ajouter enfants'}).click()
          await page.getByRole('button',{name:'Ajouter bébés'}).click()
          await page.getByRole('button',{name:'Ajouter animaux'}).click()
          if((await page.getByTestId('search-adults-count').textContent())?.trim()!=='2') throw new Error('Adult counter failed')
          if((await page.getByTestId('search-children-count').textContent())?.trim()!=='1') throw new Error('Children counter failed')
          if((await page.getByTestId('search-infants-count').textContent())?.trim()!=='1') throw new Error('Infant counter failed')
          if((await page.getByTestId('search-pets-count').textContent())?.trim()!=='1') throw new Error('Pet counter failed')
          await page.getByRole('button',{name:/Rechercher sur la carte/}).click()
          await page.waitForURL(url=>url.pathname.endsWith('/map')&&url.searchParams.get('destination')==='la-marsa'&&url.searchParams.get('checkin')==='2026-09-10'&&url.searchParams.get('checkout')==='2026-09-14'&&url.searchParams.get('guests')==='3'&&url.searchParams.get('infants')==='1'&&url.searchParams.get('pets')==='1',{timeout:5000})
          await page.getByTestId('page-map').waitFor()

          await page.goto(`${base}/`,{waitUntil:'networkidle'})
          await page.locator('.b225-search').click({position:{x:80,y:25}})
          await transition.waitFor({state:'visible'})
          await page.waitForTimeout(1050)
          if(await page.locator('.movera-st__recent').count()<1) throw new Error('Recent search was not persisted')
          await page.getByRole('button',{name:'Fermer'}).click()
          await transition.waitFor({state:'detached',timeout:3000})
          await page.getByTestId('page-home').waitFor()
          if(errors.length) throw new Error(`Runtime errors: ${errors.join('; ')}`)
          await browser.close()
          EOF
          node search-transition-smoke.mjs
      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/movera-search-preview.pid) || true
