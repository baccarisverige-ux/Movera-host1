<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movera Host</title>
    <style>
      /* Category artwork placement: Prestige artwork belongs to Expérience. */
      .b225-categories > button:nth-child(5) > img { display: none !important; }
      .b225-categories > button:nth-child(6)::before {
        content: "";
        position: static;
        inset: auto;
        width: 24px;
        height: 24px;
        padding: 0;
        flex: 0 0 24px;
        display: block;
        border-radius: 0;
        background: transparent url('/Movera-host1/assets/bootstrap/prestige-category.webp') center / contain no-repeat;
        -webkit-mask: none;
        mask: none;
        pointer-events: none;
      }
      .b225-categories > button:nth-child(6) > span { display: none !important; }
      /* Partenaire: supplied transparent handshake artwork; button background stays unchanged. */
      .b225-categories > button:nth-child(7) > span {
        width: 30px;
        height: 24px;
        display: block;
        flex: 0 0 30px;
        font-size: 0 !important;
        background: transparent center / contain no-repeat url('/Movera-host1/assets/bootstrap/partner-category.png') !important;
        background-blend-mode: normal !important;
        border: 0 !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        opacity: 1 !important;
        filter: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
